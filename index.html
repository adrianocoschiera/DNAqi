<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>La Pinta – Area riservata</title>
<style>
:root{--sea:#1F4A5C;--paper:#F4E7CB;--ink:#2A1C12;--red:#A8261E;--mustard:#D9A12A;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sea:#0E1F28}}
:root[data-theme="dark"]{--sea:#0E1F28}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:Verdana,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:16px}
.box{background:var(--paper);border-radius:22px;padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.flag{font-size:64px;line-height:1}
h1{font-family:"Comic Sans MS","Chalkboard SE",cursive;font-weight:400;font-size:38px;margin:8px 0 4px}
p{margin:0 0 16px;font-size:18px;line-height:1.45}
input{width:100%;font:inherit;font-size:24px;text-align:center;letter-spacing:.1em;padding:12px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
button{margin-top:12px;width:100%;font:inherit;font-size:20px;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px;cursor:pointer}
button:disabled{opacity:.6}
label.rem{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;font-size:16px}
label.rem input{width:22px;height:22px}
.err{color:var(--red);font-weight:700;min-height:1.4em;margin:10px 0 0}
:focus-visible{outline:4px solid var(--mustard);outline-offset:3px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="flag" aria-hidden="true">🏴‍☠️</div>
  <h1>Alt, pirata!</h1>
  <p>Per salire a bordo della Pinta serve la parola d'ordine.</p>
  <label for="pw" style="position:absolute;left:-9999px">Parola d'ordine</label>
  <input id="pw" type="password" autocapitalize="characters" spellcheck="false" placeholder="Parola d'ordine" required>
  <label class="rem"><input type="checkbox" id="rem" checked> Ricordala su questo dispositivo</label>
  <button id="go" type="submit">Sali a bordo</button>
  <p class="err" id="err" role="alert"></p>
</form>

const KEY = 'pinta:lock';
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:u8(P.s), iterations:P.n}, base, 256));
}
async function openWith(raw){
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.i)}, k, u8(P.c));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async()=>{
  try{
    const saved = localStorage.getItem(KEY);
    if(saved){ await openWith(u8(saved)); }
  }catch(e){ try{localStorage.removeItem(KEY)}catch(_){} }
})();
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const err = document.getElementById('err'), go = document.getElementById('go');
  if(!window.crypto || !crypto.subtle){ err.textContent = 'Apri la pagina dal sito sicuro (https).'; return; }
  go.disabled = true; go.textContent = 'Controllo…'; err.textContent = '';
  const pw = document.getElementById('pw').value.trim().toUpperCase();
  try{
    const raw = await derive(pw);
    if(document.getElementById('rem').checked){
      try{ localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); }catch(_){}
    }
    await openWith(raw);
  }catch(x){
    go.disabled = false; go.textContent = 'Sali a bordo';
    err.textContent = 'Parola d\u2019ordine sbagliata. Riprova!';
  }
});
</script>
