:root{--bg:#060418;--ink:#e8ecff}

#bP{right:14px;bottom:104px;width:56px;height:56px;background:#d9a91ecc!important;font-size:16px}
#bPause{right:12px;top:12px;width:44px;height:44px;border-radius:10px!important;font-size:16px}

</style>

<script>
'use strict';
// ================= CORE =================
const W = 256, H = 224;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
const SCALE = 4; ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'low';
const QS = new URLSearchParams(location.search);

function fit() {
  const sw = innerWidth, sh = innerHeight;
  let s = Math.min(sw / W, sh / H);
  const si = Math.floor(s);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- deterministic rng ----------
function hash(n) { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
let seed = 1;
function srand(s) { seed = s >>> 0 || 1; }
function rnd() { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; }
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- canvas helpers ----------
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function fromMap(rows, pal) {
  const h = rows.length, w = rows[0].length;
  const [c, g] = mkCanvas(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    const col = pal[ch]; if (!col) continue; g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  return c;
}
function tint(src, col) {
  const [c, g] = mkCanvas(src.width, src.height);
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  return c;
}
// filled pixel circle
function pcirc(g, cx, cy, r, col) {
  g.fillStyle = col; cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -r; y <= r; y++) { const hw = Math.floor(Math.sqrt(r * r - y * y + r * 0.6)); g.fillRect(cx - hw, cy + y, hw * 2 + 1, 1); }
}
function pring(g, cx, cy, r, col) {

  ctx.fillStyle = lin(ctx, 0, 0, 0, H, [[0, '#2a1a6a'], [1, '#6a3aa8']]); ctx.fillRect(0, 0, W, H);

  for (let x = 0; x < W; x += 8) { ctx.fillStyle = cols[(x / 8) % 6]; rr(ctx, x + 0.5, 176, 7, 3, 1.4); ctx.fill(); }
  // helix
  for (let y = 40; y < 172; y += 2) { const a = y * 0.06 + t * 0.04; const x1 = W / 2 + Math.sin(a) * 16, x2 = W / 2 - Math.sin(a) * 16; if (y % 8 === 0) pline(ctx, x1, y, x2, y, 'rgba(255,255,255,0.4)', 0.8); ovl(ctx, x1, y, 1.6, 1.6, '#ffffff'); ovl(ctx, x2, y, 1.6, 1.6, '#ffe46a'); }

  ctx.save(); ctx.translate(40, 176 - 37 - hop); ctx.scale(2, 2); drawProfK(ctx, t % 60 < 30 ? 3 : 0, 1, t); ctx.restore();
  ctx.save(); ctx.translate(130, 116 + Math.sin(t * 0.12) * 6); ctx.scale(2, 2); drawRiffV(ctx, -1, (t >> 3) % 4, (t >> 1) & 1, false); ctx.restore();
  const fake = { hitT: 0, state: 'gone', t }; drawBoss(fake, 196, 126);
  for (let i = 0; i < 4; i++) { const ny = 110 - ((t * 0.6 + i * 12) % 40); ctx.save(); ctx.globalAlpha = Math.min(1, (ny - 70) / 20); drawNote(180 - i * 10, ny, cols[i]); ctx.restore(); }
  if (t % 40 === 0) confettiBurst = t;
  const lines = ['I COLORI SONO TORNATI!', 'Il Prof K ha capito una cosa importante:', 'nessun DNA è uguale a un altro.', 'Ed è proprio questo il bello!', '', 'Il Grigiotron ora aiuta in laboratorio', 'e Riff suona il riff della vittoria.'];
  if (t > 40) panel(20, 4, W - 40, 88, 'rgba(20,14,60,0.85)', 'rgba(10,8,30,0.9)', 8);
  lines.forEach((s, i) => { if (t > 40 + i * 40) txt(s, W / 2, 8 + i * 11.5 + (i ? 6 : 0), i ? '#ffffff' : '#ffe46a', i ? { font: 'small', size: 7, align: 'center' } : { size: 12, align: 'center', out: OUT, outW: 2.2, grad: ['#fff6b0', '#ffc22a'] }); });
  if (t > 400) { txt('FINE', W / 2, 182, '#ffe46a', { align: 'center', size: 18, out: OUT, outW: 3, grad: ['#fff6b0', '#ffb02a'] }); txt('PUNTI ' + G.players.reduce((a, p) => a + (p.ctrl === 'ai' ? 0 : p.score), 0), W / 2, 205, '#ffffff', { font: 'small', align: 'center', out: OUT, outW: 1.2 }); }
}
let confettiBurst = 0;
// ---------- loop ----------
function update() {
  pollInput(); T++; stT++;
  if (pressed.mute) Audio_.toggleMute();
  switch (state) {
    case 'title': titleUpdate(); break;
    case 'story': if (stT > 30 && okP()) { Audio_.sfx('select'); storyNext(); } break;
    case 'controls': if (stT > 10 && (okP() || kp('Escape'))) gameState('title'); break;
    case 'play':
      if (paused) { if (pressed.pause || okP()) paused = false; else if (kp('KeyQ')) { paused = false; gameState('title'); Audio_.music('title'); } break; }
      if (pressed.pause) { paused = true; Audio_.sfx('select'); break; }
      levelUpdate(); break;
    case 'trans': trans.t++; if (trans.t > 110) gameState('play'); break;
    case 'over': overUpdate(); break;
    case 'ending': if (stT === 1) Audio_.music('end'); if (stT % 50 === 0 && stT < 300) Audio_.sfx('riff'); if (stT > 460 && okP()) { saveHi(); gameState('title'); Audio_.music('title'); } break;
  }
  for (const k in keys) kPrev[k] = keys[k]; kPrev.__ts = !!touchState.shoot;
}
function draw() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = '#0a0818'; ctx.fillRect(0, 0, W, H);
  switch (state) {
    case 'boot': break;
    case 'title': drawTitle(); break;
    case 'story': drawStory(); break;
    case 'controls': drawControls(); break;
    case 'play': drawLevel(); if (paused) { ctx.fillStyle = '#000000b0'; ctx.fillRect(0, 0, W, H); txt('PAUSA', W / 2, 90, '#ffe46a', { align: 'center', sc: 2, out: OUT }); txt('P continua  -  Q esci al titolo  -  M audio', W / 2, 120, '#ffffff', { font: 'small', align: 'center' }); } break;
    case 'trans': drawTrans(); break;
    case 'over': drawOver(); break;
    case 'ending': drawEnding(); break;
  }
}
let acc = 0, last = performance.now(), fast = 1;
function frame(now) { acc += Math.min(100, now - last) * fast; last = now; let n = 0; while (acc >= 1000 / 60 && n < 4 * fast) { update(); acc -= 1000 / 60; n++; } if (acc > 1000) acc = 0; draw(); requestAnimationFrame(frame); }
(async function boot() {
  requestAnimationFrame(frame);
  await loadFonts();
  gameState('title'); Audio_.music('title');
  window.GAME = {
    get state() { return state; }, get G() { return G; }, get lvl() { return lvl; }, keys,
    start(players = 1, easy = true, level = 0) { newGame(players, easy); if (level) startLevel(level); gameState('play'); },
    goto(i) { startLevel(i); gameState('play'); }, step(n = 1) { for (let i = 0; i < n; i++) update(); }, set fast(v) { fast = v; }, gameState, levelDone
  };
})();
