<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><title>Area riservata</title>
<style>
:root{--bg:#E8F0EC;--card:#fff;--ink:#1E3340;--lake:#2F6F7E;--sun:#F2B33D}
@media (prefers-color-scheme:dark){:root{--bg:#14212A;--card:#1D2E38;--ink:#E4EDEF;--lake:#7DB9C7}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:20px}
.box{background:var(--card);border-radius:24px;padding:28px 24px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center}
h1{font-size:24px;margin:8px 0}p{opacity:.8;font-size:16px;line-height:1.4}
input[type=password]{width:100%;font-size:20px;padding:14px;border-radius:14px;border:2px solid #C7D7D0;margin:10px 0;background:transparent;color:inherit}
button{width:100%;font-size:20px;font-weight:700;padding:14px;border:0;border-radius:999px;background:var(--lake);color:#fff;cursor:pointer}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px;margin:6px 0 14px}
.err{color:#C0392B;min-height:1.4em;font-weight:700}.lock{font-size:54px}
</style></head><body>
<form class="box" id="f"><div class="lock">🔒</div><h1>Area riservata</h1><p>Inserisci il codice di accesso che ti è stato dato dalla famiglia.</p>
<input type="password" id="pw" autocomplete="current-password" placeholder="Codice di accesso" autofocus>
<label><input type="checkbox" id="rem"> Ricorda su questo dispositivo</label>
<button type="submit" id="go">Entra</button><p class="err" id="err"></p></form>

const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function decryptIt(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(S),iterations:N,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(I)},key,u8(D));
  return new TextDecoder().decode(pt);
}
async function enter(pw,remember){
  document.getElementById("go").textContent="Apro…";
  try{ const html=await decryptIt(pw); if(remember){try{localStorage.setItem("ra-pw",pw)}catch(e){}} document.open(); document.write(html); document.close(); }
  catch(e){ document.getElementById("err").textContent="Codice non corretto"; document.getElementById("go").textContent="Entra"; try{localStorage.removeItem("ra-pw")}catch(x){} }
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();enter(document.getElementById("pw").value.trim(),document.getElementById("rem").checked);});
