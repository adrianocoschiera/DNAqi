<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nottario – Area riservata</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--night:#0d1117;--night-2:#151b24;--line:#263040;--moon:#ebe4d2;--dim:#9aa3b2;--amber:#e0a458;--amber-ink:#1a1206;--err:#e88a7a;color-scheme:dark;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--moon);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;display:grid;place-items:center;padding:16px}
.box{background:var(--night-2);border:1px solid var(--line);border-radius:20px;padding:30px 24px;max-width:400px;width:100%;text-align:center}
.moon{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f3d39b,var(--amber) 45%,#6b4a1f 100%)}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:32px;margin:6px 0 4px}
p{margin:0 0 18px;font-size:16px;line-height:1.5;color:var(--dim)}
input#pw{width:100%;font:inherit;font-size:20px;text-align:center;letter-spacing:.08em;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--night);color:var(--moon)}
button{margin-top:14px;width:100%;font:inherit;font-size:17px;font-weight:700;background:var(--amber);color:var(--amber-ink);border:0;border-radius:999px;padding:14px;cursor:pointer}
button:disabled{opacity:.6}
label.rem{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px;font-size:15px;color:var(--dim)}
label.rem input{width:20px;height:20px;accent-color:var(--amber)}
.err{color:var(--err);font-weight:700;min-height:1.4em;margin:12px 0 0}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="moon" aria-hidden="true"></div>
  <h1>Nottario</h1>
  <p>Area riservata dei Custodi del DNA.<br>Inserisci la password per entrare.</p>
  <label for="pw" style="position:absolute;left:-9999px">Password</label>
  <input id="pw" type="password" autocapitalize="characters" spellcheck="false" placeholder="Password" required>
  <label class="rem"><input type="checkbox" id="rem" checked> Ricordala su questo dispositivo</label>
  <button id="go" type="submit">Entra</button>
  <p class="err" id="err" role="alert"></p>
</form>

const KEY = 'nottario:lock';
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:u8(P.s), iterations:P.n}, base, 256));
}
async function openWith(raw){
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.i)}, k, u8(P.c));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async()=>{
  try{
    const saved = localStorage.getItem(KEY);
    if(saved){ await openWith(u8(saved)); }
  }catch(e){ try{localStorage.removeItem(KEY)}catch(_){} }
})();
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const err = document.getElementById('err'), go = document.getElementById('go');
  if(!window.crypto || !crypto.subtle){ err.textContent = 'Apri la pagina dal sito sicuro (https).'; return; }
  go.disabled = true; go.textContent = 'Controllo…'; err.textContent = '';
  const pw = document.getElementById('pw').value.trim().toUpperCase();
  try{
    const raw = await derive(pw);
    if(document.getElementById('rem').checked){
      try{ localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); }catch(_){}
    }
    await openWith(raw);
  }catch(x){
    go.disabled = false; go.textContent = 'Entra';
    err.textContent = 'Password sbagliata. Riprova.';
  }
});
</script>
