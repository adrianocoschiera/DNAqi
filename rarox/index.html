<title>I Custodi del DNA – Rarox</title>
<style>
:root{--bg:#1A0F33;--card:#2A1A55;--ink:#FFFFFF;--muted:#C9B8F5;--pink:#FF4FA3;--gold:#FFD24A;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 20%,#3B2380,var(--bg) 70%);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:3px solid #4A3290;border-radius:26px;padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.3)}
.logo{font-size:60px;line-height:1}
.brand{font-size:14px;letter-spacing:.08em;color:var(--muted);margin-top:8px}
h1{font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-size:44px;margin:2px 0 6px;color:var(--gold);text-shadow:0 4px 0 #6A3FD0}
p{margin:0 0 16px;font-size:17px;line-height:1.45;color:var(--muted)}
input{width:100%;font:inherit;font-size:24px;text-align:center;letter-spacing:.1em;padding:12px;border:3px solid #6A3FD0;border-radius:14px;background:#fff;color:#1A0F33}
button{margin-top:12px;width:100%;font:inherit;font-size:21px;font-weight:800;background:var(--pink);color:#fff;border:0;border-bottom:6px solid #C42C78;border-radius:16px;padding:14px;cursor:pointer}
button:disabled{opacity:.6}
label.rem{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;font-size:15px;color:var(--muted)}
label.rem input{width:22px;height:22px}
.err{color:#FF8CC6;font-weight:800;min-height:1.4em;margin:10px 0 0}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">

  <p>Per entrare nella città dei Custodi serve la parola d’ordine.</p>
  <label for="pw" style="position:absolute;left:-9999px">Parola d’ordine</label>
  <input id="pw" type="password" autocapitalize="characters" spellcheck="false" placeholder="Parola d’ordine" required>
  <label class="rem"><input type="checkbox" id="rem" checked> Ricordala su questo dispositivo</label>
  <button id="go" type="submit">Entra in Rarox</button>

</form>

const KEY = 'rarox:lock';
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:u8(P.s), iterations:P.n}, base, 256));
}
async function openWith(raw){
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.i)}, k, u8(P.c));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async()=>{
  try{ const saved = localStorage.getItem(KEY); if(saved){ await openWith(u8(saved)); } }
  catch(e){ try{localStorage.removeItem(KEY)}catch(_){} }
})();
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const err = document.getElementById('err'), go = document.getElementById('go');
  if(!window.crypto || !crypto.subtle){ err.textContent = 'Apri la pagina dal sito sicuro (https).'; return; }
  go.disabled = true; go.textContent = 'Controllo…'; err.textContent = '';
  const pw = document.getElementById('pw').value.trim().toUpperCase();
  try{
    const raw = await derive(pw);
    if(document.getElementById('rem').checked){ try{ localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); }catch(_){} }
    await openWith(raw);
  }catch(x){
    go.disabled = false; go.textContent = 'Entra in Rarox';
    err.textContent = 'Parola d’ordine sbagliata. Riprova!';
  }
});
