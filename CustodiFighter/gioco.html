<meta charset="utf-8">

<title>Custodi Fighter</title>
<style>
:root{--bg:#060418;--ink:#e8ecff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060418;--ink:#e8ecff}}
:root[data-theme="dark"]{--bg:#060418;--ink:#e8ecff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#141038 0%,#060418 70%)}
canvas#game{display:block;background:#000;box-shadow:0 0 60px #3a1d7a55}
#touch{display:none;position:fixed;inset:0;pointer-events:none}
#touch .b{position:absolute;pointer-events:auto;touch-action:none;border:3px solid #ffffffb0;color:#fff;font:900 22px/1 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#1b2f7acc;box-shadow:0 4px 0 #0008;opacity:.6}
#touch .b.on{transform:translateY(3px);box-shadow:none;opacity:1}
#dpad{position:absolute;left:14px;bottom:14px;width:150px;height:150px;pointer-events:auto;touch-action:none}
#dpad div{position:absolute;width:50px;height:50px;background:#1b2f7acc;border:3px solid #ffffffb0;color:#fff;display:flex;align-items:center;justify-content:center;font:900 20px system-ui;border-radius:10px;opacity:.6}
#dpad .on{background:#3d63e0}
#tu{left:50px;top:0}#td{left:50px;top:100px}#tl{left:0;top:50px}#tr{left:100px;top:50px}
#bJ{right:14px;bottom:20px;width:70px;height:70px;font-size:18px!important;background:#c9782acc!important}
#bS{right:98px;bottom:20px;width:74px;height:74px;background:#2c96d6cc!important}
#bB{right:98px;bottom:104px;width:56px;height:56px;background:#7c3fc4cc!important;font-size:16px}
#bP{right:14px;bottom:104px;width:56px;height:56px;background:#d9a91ecc!important;font-size:16px}
#bPause{right:12px;top:12px;width:44px;height:44px;border-radius:10px!important;font-size:16px}
@media (pointer:coarse){#touch{display:block}}
</style>
</head>

<script>
'use strict';
// ================= CORE =================
const W = 384, H = 216;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
const SCALE = 4; ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'low';
const QS = new URLSearchParams(location.search);

function fit() {
  const sw = innerWidth, sh = innerHeight;
  let s = Math.min(sw / W, sh / H);
  const si = Math.floor(s);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- deterministic rng ----------
function hash(n) { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
let seed = 1;
function srand(s) { seed = s >>> 0 || 1; }
function rnd() { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; }
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- canvas helpers ----------
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function fromMap(rows, pal) {
  const h = rows.length, w = rows[0].length;
  const [c, g] = mkCanvas(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    const col = pal[ch]; if (!col) continue; g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  return c;
}
function tint(src, col) {
  const [c, g] = mkCanvas(src.width, src.height);
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  return c;
}
// filled pixel circle
function pcirc(g, cx, cy, r, col) {
  g.fillStyle = col; cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -r; y <= r; y++) { const hw = Math.floor(Math.sqrt(r * r - y * y + r * 0.6)); g.fillRect(cx - hw, cy + y, hw * 2 + 1, 1); }
}
function pring(g, cx, cy, r, col) {

    const p = portrait(ALL[i], 1); ctx.drawImage(p, x + 9, y + 3, 26, 28 + 3);
  }
  const frame = (i, col, lbl, done) => { const x = GX + (i % 8) * CELLW, y = GY + Math.floor(i / 8) * CELLH; const on = done || (T >> 3) & 1; ctx.fillStyle = on ? col : '#ffffff'; ctx.fillRect(x, y, CELLW, 2); ctx.fillRect(x, y + CELLH - 2, CELLW, 2); ctx.fillRect(x, y, 2, CELLH); ctx.fillRect(x + CELLW - 2, y, 2, CELLH); txt(lbl, x + 3, y + 2, col, { font: 'small', out: OUT }); };

}

// ---------- arcade ----------
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function beginArcade(pi) {

}
function arcadeLvl() { const base = [[0.1, 0.4], [0.3, 0.72], [0.55, 0.95]][diff]; const k = arcade.idx / 7; return lerp(base[0], base[1], k) + (arcade.idx === 7 ? 0.05 : 0); }
function nextArcadeFight() {
  const opp = arcade.ladder[arcade.idx];

}
function arcadeEnd(w) {

  if (w === 0) { quoteInfo.next = () => { arcade.idx++; if (arcade.idx >= arcade.ladder.length) { go('ending'); Audio_.music('end'); } else nextArcadeFight(); }; }

}
function startMatch(a, b, c1, c2, onEnd, stage, lvl = 0.5) {

    onEnd: onEnd || (w => { if (mode === 'demo') { go('title'); Audio_.music('title'); return; } quoteInfo = { ch: fighters[w].ch, other: fighters[w ^ 1].ch, text: fighters[w].ch.quote, win: true, vs: true, next: () => openSelect() }; go('quote'); }) });
  go('fight'); paused = false;
}
function showVS(a, b, stage, next) { vsInfo = { a, b, stage, next }; go('vs'); Audio_.sfx('horn'); }
function vsUpdate() { if (stT === 20) Audio_.say(a_name(vsInfo.a) + ' contro ' + a_name(vsInfo.b)); if (stT > 160 || (stT > 40 && okP())) { const n = vsInfo.next; n(); } }
function a_name(c) { return c.name.toLowerCase(); }
function drawVS() {
  const t = stT; ctx.fillStyle = '#0c0a1a'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#c83a3a'; for (let y = 0; y < H; y++) { const x = W / 2 - 30 + (H / 2 - y) * 0.35; ctx.fillRect(0, y, x, 1); } ctx.fillStyle = '#2a4ac8'; for (let y = 0; y < H; y++) { const x = W / 2 + 30 + (H / 2 - y) * 0.35; ctx.fillRect(x, y, W - x, 1); }

// ---------- quote / continue / ending ----------
function quoteUpdate() { if (stT > 40 && okP()) { Audio_.sfx('select'); const n = quoteInfo.next; n(); } }
function drawQuote() {
  ctx.fillStyle = '#141038'; ctx.fillRect(0, 0, W, H); drawDNA(W - 40, 0, H, 18, T, 0.4);
  const ch = quoteInfo.ch; const p = portrait(ch, 4, 'win'); ctx.drawImage(p, 18, 50);
  txt(ch.name, 70, 20, '#ffe46a', { align: 'center', out: OUT });
  const bx = 140, by = 64, bw = 220; const lines = wrapText(ch.quote, bw - 16, 'small');
  ctx.fillStyle = OUT; ctx.fillRect(bx - 2, by - 2, bw + 4, lines.length * 12 + 20); ctx.fillStyle = '#fff8e8'; ctx.fillRect(bx, by, bw, lines.length * 12 + 16); ctx.fillRect(bx - 8, by + 16, 8, 6);
  const n = Math.floor(stT / 2); let used = 0;
  lines.forEach((l, i) => { const k = clamp(n - used, 0, l.length); used += l.length; txt(l.slice(0, k), bx + 8, by + 8 + i * 12, '#2a1a4a', { font: 'small' }); });
  if (quoteInfo.win && mode === 'arcade' && arcade) txt(arcade.idx + 1 >= arcade.ladder.length ? 'HAI SCONFITTO IL GRIGIO!' : 'PROSSIMA SFIDA!', bx + bw / 2, 150, '#8affe0', { align: 'center', out: OUT });
  if (!quoteInfo.win) txt(quoteInfo.other.name + ' SI RIPOSA UN PO\'...', bx + bw / 2, 150, '#ffffff', { font: 'small', align: 'center', out: OUT });
  if (stT > 40 && (T >> 4) & 1) txt('INVIO PER CONTINUARE', W / 2, H - 16, '#8a8ac8', { font: 'small', align: 'center' });
}
function continueUpdate() {

  if (okP() && stT > 20) { Audio_.sfx('select'); nextArcadeFight(); }
  if (stT > 60 * 10 || backP()) { go('title'); Audio_.music('title'); arcade = null; }
}
function drawContinue() {
  ctx.fillStyle = '#0c0a1a'; ctx.fillRect(0, 0, W, H);
  const n = 9 - Math.floor(stT / 60); const img = renderFighter(arcade.p1, POSES.sit, { t: T, ex: 'tired' }); ctx.drawImage(img, W / 2 - FOX, 150 - FOY); dizzyStars(W / 2, 150 - 50, T);
  txt('RIPROVIAMO?', W / 2, 30, '#ffe46a', { align: 'center', sc: 2, out: OUT });

}
const GRIGIO_COLORI = Object.assign({}, BOSS, { top: { style: 'suit', col: '#c83a8a', col2: '#ffe46a' }, pants: { col: '#3a8ae8' }, hat: '#3ac86a', glasses: { type: 'rainbow' }, skin: '#f0c0a0', hair: { style: 'short', col: '#8a5a3a' } });
function endingUpdate() { if (stT > 600 && okP()) { go('title'); Audio_.music('title'); arcade = null; } if (stT === 330) Audio_.sfx('clear'); if (stT === 260) Audio_.say('cheese!'); }
function drawEnding() {
  const t = stT;
  const st = buildStage('grigio'); ctx.drawImage(st, 96, 0, W, H, 0, 0, W, H);
  const cast = [...ALL]; const back = cast.slice(0, 8), front = cast.slice(8);
  const drawRow = (row, y, off) => row.forEach((c, i) => { const x = off + i * 44; const pose = t > 200 ? (i % 2 ? POSES.wave : POSES.win) : POSES.idle; const P = Object.assign({}, pose); if (t > 200 && i % 2) P.af = [150, 170 + Math.sin((t + i * 7) * 0.3) * 25]; const img = renderFighter(c, P, { t: t + i * 9, ex: t > 200 ? 'win' : 'n' }); ctx.save(); ctx.translate(x, y); if (i >= row.length / 2) ctx.scale(-1, 1); ctx.drawImage(img, -FOX, -FOY); ctx.restore(); });
  drawRow(back, 160, 38);
  const gimg = renderFighter(t > 120 ? GRIGIO_COLORI : BOSS, t > 120 ? POSES.wave : POSES.sit, { t, ex: t > 120 ? 'win' : 'tired' }); ctx.drawImage(gimg, W / 2 - FOX, 208 - FOY);

  ctx.fillStyle = '#000000a0'; ctx.fillRect(0, 0, W, 34);
  txt(msg[0], W / 2, 6, t >= 250 ? '#ffe46a' : '#ffffff', { font: t >= 250 ? 'big' : 'small', align: 'center' }); txt(msg[1], W / 2, 20, '#ffffff', { font: 'small', align: 'center' });
  if (t > 330) { const k = Math.min(1, (t - 330) / 60); ctx.globalAlpha = k; ctx.fillStyle = '#0c0a1ad0'; ctx.fillRect(60, 38, W - 120, 74); ctx.globalAlpha = 1; if (k >= 1) { txt('FINE', W / 2, 44, '#ffe46a', { align: 'center', sc: 2, out: OUT }); txt('CUSTODI FIGHTER - Il Torneo dell\'Amicizia', W / 2, 68, '#ffffff', { font: 'small', align: 'center' }); txt('un gioco per I Custodi del DNA', W / 2, 80, '#8affe0', { font: 'small', align: 'center' }); txt('Livello: ' + DIFFN[diff] + '  -  Campione: ' + arcade.p1.name, W / 2, 92, '#c8c8f0', { font: 'small', align: 'center' }); } }
  if (t > 600 && (T >> 4) & 1) txt('INVIO PER IL TITOLO', W / 2, 102, '#8a8ac8', { font: 'small', align: 'center' });
}
// ---------- demo ----------
function startDemo(lvl = 0.6, a, b) {
  mode = 'demo'; const i = a !== undefined ? a : RI(0, 15); let j = b !== undefined ? b : RI(0, 15); if (j === i && b === undefined) j = (j + 1) % 16;
  const B = j === 16 ? BOSS : ALL[j];
  startMatch(ALL[i], B, 'cpu', 'cpu', null, B.stage, lvl);
}
// ---------- pause ----------
function pauseUpdate() {
  if (pressed.up || pressed.down) { pauseI ^= 1; Audio_.sfx('cursor'); }
  if (pressed.pause || (okP() && pauseI === 0)) { paused = false; Audio_.sfx('select'); }
  else if (okP() && pauseI === 1) { paused = false; fight = null; go('title'); Audio_.music('title'); }
}
function drawPause() { ctx.fillStyle = '#000000b0'; ctx.fillRect(0, 0, W, H); txt('PAUSA', W / 2, 70, '#ffe46a', { align: 'center', sc: 2, out: OUT }); ['RIPRENDI', 'ESCI AL TITOLO'].forEach((s, i) => txt(s, W / 2, 104 + i * 16, i === pauseI ? '#ffe46a' : '#a8a8c8', { align: 'center', out: OUT })); txt('M = AUDIO ' + (Audio_.muted ? 'SPENTO' : 'ACCESO'), W / 2, 150, '#8a8ac8', { font: 'small', align: 'center' }); }

// ---------- main loop ----------
function update() {
  pollInput(); T++; stT++;
  if (pressed.mute) Audio_.toggleMute();
  switch (state) {
    case 'title': titleUpdate(); break;
    case 'story': storyUpdate(); break;
    case 'controls': if (stT > 10 && (okP() || backP())) { go('title'); } break;
    case 'select': selectUpdate(); break;
    case 'vs': vsUpdate(); break;
    case 'fight':
      if (mode === 'demo' && (okP() || backP())) { fight = null; go('title'); Audio_.music('title'); break; }
      if (paused) { pauseUpdate(); break; }
      if (pressed.pause && fight.phase !== 'done') { paused = true; pauseI = 0; Audio_.sfx('select'); break; }
      fightUpdate(); break;
    case 'quote': quoteUpdate(); break;
    case 'continue': continueUpdate(); break;
    case 'ending': endingUpdate(); break;
  }
  for (const k in keys) kPrev[k] = keys[k]; kPrev.__ts = !!touchState.shoot;
}
function draw() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = '#0c0a1a'; ctx.fillRect(0, 0, W, H);
  switch (state) {
    case 'boot': txt('...', W / 2, H / 2, '#fff', { align: 'center' }); break;
    case 'title': drawTitle(); break;
    case 'story': drawStory(); break;
    case 'controls': drawControls(); break;
    case 'select': drawSelect(); break;
    case 'vs': drawVS(); break;
    case 'fight': if (fight) { drawFightScene(); if (mode === 'demo' && (T >> 5) & 1) txt('DIMOSTRAZIONE - INVIO PER GIOCARE', W / 2, 50, '#ffffff', { font: 'small', align: 'center', out: OUT }); if (paused) drawPause(); } break;
    case 'quote': drawQuote(); break;

let acc = 0, last = performance.now(), fast = 1;
function frame(now) { acc += Math.min(100, now - last) * fast; last = now; let n = 0; while (acc >= 1000 / 60 && n < 4 * fast) { update(); acc -= 1000 / 60; n++; } if (acc > 1000) acc = 0; draw(); requestAnimationFrame(frame); }

  window.GAME = {
    get state() { return state; }, get fight() { return fight; }, get fighters() { return fighters; }, get arcade() { return arcade; }, get sel() { return sel; },
    ROSTER, BOSS, startDemo, startMatch, beginArcade: (i) => { mode = 'arcade'; beginArcade(i); }, go, set fast(v) { fast = v; }, get fast() { return fast; },
    setMode(m) { mode = m; }, step(n = 1) { for (let i = 0; i < n; i++) update(); }, set diff(v) { diff = v; }, get diff() { return diff; }, keys
  };
})();

// ================= HD overrides (HUD bars, DNA) =================
function drawBar(x, y, w, frac, col, rev, back = '#3a1a2a') {
  rr(ctx, x - 1, y - 1, w + 2, 9, 3); ctx.fillStyle = OUT; ctx.fill(); rr(ctx, x, y, w, 7, 2.5); ctx.fillStyle = back; ctx.fill();
  const fw = w * clamp(frac, 0, 1); if (fw > 0.5) { rr(ctx, rev ? x + w - fw : x, y, fw, 7, 2.5); ctx.fillStyle = lin(ctx, 0, y, 0, y + 7, [[0, shade(col, 1.35)], [0.5, col], [1, shade(col, 0.75)]]); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.35)'; rr(ctx, (rev ? x + w - fw : x) + 1, y + 0.8, Math.max(0, fw - 2), 1.6, 0.8); ctx.fill(); }
}
function drawDNA(cx, y0, y1, amp, t, alpha = 1) {
