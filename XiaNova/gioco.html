<title>Xia Nova Arcade</title>
<style>
:root{--bg:#05030f;--ink:#e8ecff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05030f;--ink:#e8ecff}}
:root[data-theme="dark"]{--bg:#05030f;--ink:#e8ecff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#120a2a 0%,#05030f 70%)}
canvas#game{display:block;background:#000;box-shadow:0 0 60px #3a1d7a55}
#touch{display:none;position:fixed;inset:0;pointer-events:none}
#touch .b{position:absolute;pointer-events:auto;touch-action:none;border:3px solid #ffffffb0;color:#fff;font:900 22px/1 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#1b2f7acc;box-shadow:0 4px 0 #0008;opacity:.6}
#touch .b.on{transform:translateY(3px);box-shadow:none;opacity:1}
#dpad{position:absolute;left:14px;bottom:14px;width:150px;height:150px;pointer-events:auto;touch-action:none}
#dpad div{position:absolute;width:50px;height:50px;background:#1b2f7acc;border:3px solid #ffffffb0;color:#fff;display:flex;align-items:center;justify-content:center;font:900 20px system-ui;border-radius:10px;opacity:.6}
#dpad .on{background:#3d63e0}
#tu{left:50px;top:0}#td{left:50px;top:100px}#tl{left:0;top:50px}#tr{left:100px;top:50px}
#bJ{right:14px;bottom:20px;width:74px;height:74px;background:#c9782acc!important}
#bS{right:98px;bottom:20px;width:74px;height:74px;background:#2c96d6cc!important}
#bB{right:98px;bottom:104px;width:56px;height:56px;background:#7c3fc4cc!important;font-size:16px}
#bP{right:14px;bottom:104px;width:56px;height:56px;background:#d9a91ecc!important;font-size:16px}
#bPause{right:12px;top:12px;width:44px;height:44px;border-radius:10px!important;font-size:16px}
@media (pointer:coarse){#touch{display:block}}
</style>
</head>

<script>
'use strict';
// ================= CORE =================
const W = 480, H = 270;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
const SCALE = 3; ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'low';
const QS = new URLSearchParams(location.search);

function fit() {
  const sw = innerWidth, sh = innerHeight;
  let s = Math.min(sw / W, sh / H);
  const si = Math.floor(s);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- deterministic rng ----------
function hash(n) { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
let seed = 1;
function srand(s) { seed = s >>> 0 || 1; }
function rnd() { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; }
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- canvas helpers ----------
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function fromMap(rows, pal) {
  const h = rows.length, w = rows[0].length;
  const [c, g] = mkCanvas(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    const col = pal[ch]; if (!col) continue; g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  return c;
}
function tint(src, col) {
  const [c, g] = mkCanvas(src.width, src.height);
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  return c;
}
// filled pixel circle
function pcirc(g, cx, cy, r, col) {
  g.fillStyle = col; cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -r; y <= r; y++) { const hw = Math.floor(Math.sqrt(r * r - y * y + r * 0.6)); g.fillRect(cx - hw, cy + y, hw * 2 + 1, 1); }
}
function pring(g, cx, cy, r, col) {

function surfaceAt(x, groundOnly = false) {
  let best = null;
  for (const b of ground) if (x >= b.x && x < b.x + b.w) best = best === null ? b.y : Math.min(best, b.y);
  if (!groundOnly) for (const p of plats) if (x >= p.x && x < p.x + p.w) best = best === null ? p.y : Math.min(best, p.y);
  return best;
}
function groundBelow(x, y) { // first surface at or below y
  let best = null;
  for (const b of ground) if (x >= b.x && x < b.x + b.w && b.y >= y - 2) best = best === null ? b.y : Math.min(best, b.y);
  for (const p of plats) if (x >= p.x && x < p.x + p.w && p.y >= y - 2) best = best === null ? p.y : Math.min(best, p.y);
  return best;
}
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function moveBody(b) {
  b.vy = Math.min(b.vy + GRAV * (b.gmul || 1), MAXFALL);
  // horizontal
  b.x += b.vx;
  for (const g of ground) if (ov(b, g)) {
    if (b.y + b.h - g.y <= 6 && b.vy >= 0) { b.y = g.y - b.h; continue; } // small step-up
    if (b.vx > 0) b.x = g.x - b.w; else if (b.vx < 0) b.x = g.x + g.w; b.hitWall = true;
  }
  const oldBottom = b.y + b.h;
  b.y += b.vy; b.onGround = false; b.onPlat = null;
  for (const g of ground) if (ov(b, g)) { if (b.vy >= 0) { b.y = g.y - b.h; b.vy = 0; b.onGround = true; b.onSolid = g; } else { b.y = g.y + g.h; b.vy = 0; } }
  if (b.vy >= 0 && !(b.drop > 0)) for (const p of plats) {
    if (b.x + b.w > p.x && b.x < p.x + p.w && oldBottom <= p.y + 1 && b.y + b.h >= p.y) { b.y = p.y - b.h; b.vy = 0; b.onGround = true; b.onPlat = p; }
  }
  if (b.drop > 0) b.drop--;
}

// ---------- spawning ----------
function makeEnemy(type, x, y) {
  const base = { t: 0, vx: 0, vy: 0, flash: 0, dir: -1, onGround: false, atk: RI(50, 110), throwT: 0, shieldFlash: 0, kind: type };
  switch (type) {

    case 'shield': return Object.assign(base, { w: 12, h: 20, hp: 5, maxhp: 5, sc: 200, spd: 0.5, keep: R(50, 80), x, y });
    case 'drone': return Object.assign(base, { w: 16, h: 16, hp: 4, maxhp: 4, sc: 200, fly: true, side: Math.random() < 0.5 ? -1 : 1, fireT: RI(80, 130), charge: 0, x, y });
    case 'minidrone': return Object.assign(base, { kind: 'drone', w: 16, h: 16, hp: 2, maxhp: 2, sc: 50, fly: true, side: Math.random() < 0.5 ? -1 : 1, fireT: RI(90, 150), charge: 0, x, y });
    case 'walker': return Object.assign(base, { w: 34, h: 54, hp: 34, maxhp: 34, sc: 1000, fireT: 90, burst: 0, cycle: 0, muzzle: 0, x, y });
  }
}
function spawn(type, side) {
  let x, y; const dims = { ombra: [12, 20], shield: [12, 20], drone: [16, 16], minidrone: [16, 16], walker: [34, 54] }[type];
  if (side === 'a') { x = Math.random() < 0.7 ? cam + W + 10 : cam - 26; y = 30 + Math.random() * 40; }
  else if (side === 'r' || side === 'l') {
    x = side === 'r' ? cam + W + 6 : cam - dims[0] - 6;
    let s = surfaceAt(x + dims[0] / 2, true);
    if (s === null) { x = side === 'r' ? cam + W - 60 - Math.random() * 60 : cam + 30 + Math.random() * 60; y = -30; }
    else y = s - dims[1];
  } else { x = side === 'tr' ? cam + W - 50 - Math.random() * 120 : cam + 30 + Math.random() * 120; y = -30; }
  const e = makeEnemy(type, x, y); e.dropIn = y < 0; enemies.push(e); return e;
}
function queueSpawns(list, tag) { for (const [type, side, delay] of list) spawnQ.push({ at: missionT + (delay || 0), type, side, tag }); }

// ---------- player actions ----------
function muzzlePos() {
  const p = player; const cx = p.x + p.w / 2, fy = p.y + p.h; const sy = -21 + (p.crouch ? 7 : 0);
  if (p.aim === 'up') return [cx + p.dir * 7, fy + sy - 15];
  if (p.aim === 'down') return [cx + p.dir * 3, fy + sy + 19];
  return [cx + p.dir * 15, fy + sy + 3];
}
function fire() {
  const p = player; const [mx, my] = muzzlePos();
  if (p.aim === 'fwd') { // point-blank: bracelet strike (like the knife in arcade run'n'guns)
    const mb = { x: p.dir > 0 ? p.x + p.w - 2 : p.x - 18, y: p.y - 2, w: 20, h: p.h + 2 };
    const near = enemies.filter(e => !e.dead && ov(mb, e) && e.kind !== 'walker');
    const nc = cages.filter(c => !c.broken && ov(mb, c));
    if (near.length || nc.length) {
      for (const e of near) { damageEnemy(e, 3); sparks(e.x + e.w / 2, e.y + 8, '#bff8ff', 8, 2); }
      for (const c of nc) { c.hp -= 3; c.flash = 4; if (c.hp <= 0) breakCage(c); }
      p.cd = 14; p.shootT = 10; p.meleeT = 8; Audio_.sfx('tink'); Audio_.sfx('hit'); return;
    }
  }
  const dx = p.aim === 'up' || p.aim === 'down' ? 0 : p.dir, dy = p.aim === 'up' ? -1 : p.aim === 'down' ? 1 : 0;
  const ang = Math.atan2(dy, dx);
  parts.push({ k: 'flash', x: mx, y: my, life: 4 });
  if (weapon === 'S') {
    for (const a of [-0.22, 0, 0.22]) pb.push({ k: 'star', x: mx, y: my, vx: Math.cos(ang + a) * 6, vy: Math.sin(ang + a) * 6, dmg: 1, life: 70 });
    p.cd = 11; Audio_.sfx('spread');
  } else if (weapon === 'R') {
    pb.push({ k: 'laser', x: mx, y: my, vx: dx * 9, vy: dy * 9, dmg: 1.2, life: 60, pierce: true, hit: new Set() });
    p.cd = 6; Audio_.sfx('laser');
  } else if (weapon === 'C') {
    pb.push({ k: 'comet', x: mx, y: my, vx: dx * 4 + (dy ? 0 : 0), vy: dy * 4 - (dy ? 0 : 0.5), dmg: 2.2, life: 120 });
    p.cd = 13; Audio_.sfx('comet');
  } else {
    pb.push({ k: 'star', x: mx, y: my + RI(-1, 1), vx: dx * 6.5, vy: dy * 6.5, dmg: 1, life: 60 });
    p.cd = 7; Audio_.sfx('shot');

}

function hurtPlayer() {

// ---------- update: player ----------
function updatePlayer() {
  const p = player; p.t++;
  if (p.dead) {
    p.dead++; p.vy += GRAV; p.y += p.vy;
    if (p.dead > 100 && state === 'play') { state = 'continue'; contT = 600; }
    return;
  }
  if (p.inv > 0) p.inv--; if (p.cd > 0) p.cd--; if (p.shootT > 0) p.shootT--; if (p.meleeT > 0) p.meleeT--;
  const ax = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const wasCrouch = p.crouch;
  p.crouch = inp.down && p.onGround;
  if (p.crouch && !wasCrouch) { p.y += 10; p.h = 24; } else if (!p.crouch && wasCrouch) { p.y -= 10; p.h = 34; }
  const spd = p.crouch ? 0.7 : 1.8;
  if (p.onGround) p.coyote = 7; else if (p.coyote > 0) p.coyote--;
  p.vx = ax * spd; if (ax) p.dir = ax;
  if (pressed.jump) p.jbuf = 6; else if (p.jbuf > 0) p.jbuf--;
  if (p.jbuf > 0 && (p.onGround || p.coyote > 0) && p.vy >= -1) {
    p.jbuf = 0; p.coyote = 0;
    if (inp.down && p.onPlat) { p.drop = 14; p.y += 2; }
    else { p.vy = -5.8; Audio_.sfx('jump'); sparks(p.x + 6, p.y + p.h, '#c8e8ff', 5, 1.2); if (p.crouch) { p.crouch = false; p.y -= 10; p.h = 34; } }
  }
  if (!inp.jump && p.vy < -2.2) p.vy = -2.2;
  p.aim = inp.up ? 'up' : (inp.down && !p.onGround ? 'down' : 'fwd');
  if (inp.shoot && p.cd <= 0) fire();
  if (pressed.bomb) throwBomb();
  if (pressed.super) doSuper();
  moveBody(p);
  // camera bounds
  const minX = cam + 2, maxX = (lock ? lock.x : LEVELS[world].len) + W - p.w - 2;
  if (p.x < minX) p.x = minX; if (p.x > Math.min(maxX, LEVELS[world].len - p.w - 2)) p.x = Math.min(maxX, LEVELS[world].len - p.w - 2);
  if (p.onGround && !p.onPlat && p.onSolid) { const sx = p.x; if (sx > p.onSolid.x + 6 && sx + p.w < p.onSolid.x + p.onSolid.w - 6) p.safeX = sx; }

  p.state = !p.onGround ? 'jump' : p.crouch ? 'crouch' : Math.abs(p.vx) > 0.1 ? 'run' : 'idle';
  if (p.state === 'run') p.frame = (p.frame + 0.22) % 8;

  const hb = { x: p.x - 2, y: p.y, w: p.w + 4, h: p.h };
  for (const s of stars) if (!s.taken && Math.abs(s.x - (p.x + p.w / 2)) < 12 && s.y > p.y - 6 && s.y < p.y + p.h + 6) {
    s.taken = true; starsN++; score += 10; power = Math.min(100, power + 3.5); Audio_.sfx('star'); sparks(s.x, s.y, '#ffe46a', 6, 1.5);
  }
  for (const it of items) if (!it.taken && ov(hb, it)) collectItem(it);
}
function collectItem(it) {
  it.taken = true; Audio_.sfx('item'); sparks(it.x + 8, it.y + 8, '#fff', 12, 2);
  const k = it.k;
  if (WEAPONS[k]) { weapon = k; ammo = WEAPONS[k].ammo; popup(it.x, it.y - 6, WEAPONS[k].short + '!', '#ffe46a'); Audio_.say(WEAPONS[k].say); }
  else if (k === 'H') { player.hearts = Math.min(4, player.hearts + 1); popup(it.x, it.y - 6, 'CUORE +1', '#ff8aa0'); if (player.hearts === 4) score += 500; }
  else if (k === 'B') { bombsN += 6; popup(it.x, it.y - 6, 'BOMBE +6', '#c8a0ff'); Audio_.say('Bombe stellari!'); }
  else if (k === 'P') { score += 2000; power = Math.min(100, power + 30); popup(it.x, it.y - 6, '+2000', '#ffe46a'); }
}

// ================= STATE MACHINE & LOOP =================
function goTitle() { state = 'title'; stT = 0; cam = 0; buildBG(0); player = null; parts = []; Audio_.music('title'); }

function afterClear() {
  if (world === 0) { buildBG(0); startStory('after1', () => startMission(1, true)); }
  else if (world === 1) { buildBG(1); startStory('after2', () => startMission(2, true)); }
}
function update() {

    case 'story': updateStory(); break;

    case 'pause': if (pressed.pause || pressed.start) state = 'play'; if (pressed.restart) startMission(world, false); break;

    case 'gameover': if (stT > 90 && (pressed.start || pressed.shoot)) goTitle(); break;

      if (world === 2 && clearT > 200 && (pressed.start || pressed.shoot)) { buildBG(2); startStory('ending', () => { state = 'fine'; stT = 0; Audio_.music('end'); }); }

let acc = 0, last = performance.now();

})();
