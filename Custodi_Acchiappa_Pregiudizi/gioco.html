<style>
:root{--border:#000}
html,body{margin:0;height:100%;background:var(--border);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}

#c{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
#dlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:5}

#box{background:#352879;color:#6C5EB5;border:6px solid #6C5EB5;padding:18px 20px;font:700 18px/1.4 "Courier New",monospace;max-width:86vw;text-transform:uppercase}

#box .row{display:flex;gap:10px;flex-wrap:wrap}
#box button{background:#6C5EB5;color:#352879;border:0;font:inherit;padding:6px 14px;cursor:pointer}
#tc{position:fixed;inset:auto 0 0 0;height:0;display:none;z-index:4;pointer-events:none}
body.touch #tc{display:block}
.tb{position:fixed;width:58px;height:58px;border-radius:12px;background:rgba(108,94,181,.35);border:2px solid rgba(149,149,149,.6);color:#fff;font:700 14px "Courier New",monospace;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}

const GC = {};
function glyph(ch, c) { const k = ch + '|' + c; if (GC[k]) return GC[k]; const o = document.createElement('canvas'); o.width = 8; o.height = 8; const q = o.getContext('2d'); q.fillStyle = PAL[c]; const d = FD[ch]; if (d) d.split(' ').forEach((r, y) => { for (let x = 0; x < 5; x++) if (r[x] === '#') q.fillRect(x, y, 2, 1); }); return (GC[k] = o); }
function norm(s) { return String(s).toUpperCase().replace(/[ÀÁ]/g, "A'").replace(/[ÈÉ]/g, "E'").replace(/[ÌÍ]/g, "I'").replace(/[ÒÓ]/g, "O'").replace(/[ÙÚ]/g, "U'"); }

function wrap(s, n) { const out = []; let cur = ''; norm(s).split(' ').forEach(w => { if ((cur + ' ' + w).trim().length > n) { out.push(cur.trim()); cur = w; } else cur += ' ' + w; }); if (cur.trim()) out.push(cur.trim()); return out; }

function canvas(w, h) { const o = document.createElement('canvas'); o.width = w; o.height = h; return o; }

function spr(o, x, y, sc = 1) { g.drawImage(o, Math.round(x), Math.round(y), o.width * sc, o.height * sc); }
// the Custodi (front 3/4 view, facing right, with the DNA-ray backpack)
const B_TOP = [

  '..hhhhhh..',

  '..RkRRkR..',
  '..RRRRRR..',
  '...RRRR...',

  'llmSwwSS..',
  'llmSSSSS..',
  '.llSSSSS..',
  '..SSkkSS..'];

  { n: 'SUPER X', S: K.p, h: K.y, R: K.R }, // viola

const BSPR = TEAM.map(t => B_LEGS.map(l => { const s = mkSpr(B_TOP.concat(l), { S: t.S, h: t.h }); return [s, flip(s)]; }));
const SLIMED = B_LEGS.map(l => { const s = mkSpr(B_TOP.concat(l), { S: K.G, h: K.G, R: K.G, w: K.g, m: K.g, l: K.G }); return [s, flip(s)]; });
function drawBuster(i, x, yFeet, frame, faceLeft, slimed, sc = 1) { const set = slimed ? SLIMED : BSPR[i]; const s = set[frame][faceLeft ? 1 : 0]; const tall = i === 2 ? 1.18 : 1; g.drawImage(s, Math.round(x - 5 * sc), Math.round(yFeet - 18 * sc * tall), 10 * sc, Math.round(18 * sc * tall)); }

const GH = [
  ['.....llllll.....', '...llllllllll...', '..llllllllllll..', '.lllwwllllwwlll.', '.lllwkllllkwlll.', 'llllllllllllllll', 'lllllkkkkkklllll', 'llllkrrrrrrkllll', 'lllllkkkkkklllll', '.llllllllllllll.', '.llmllllllllmll.', '..llmlllllllmll.', '..ll.lll.lll.ll.', '..l...l...l...l.'],

const PREJ = ["NON CE LA FARA' MAI", "E' SOLO UN CAPRICCIO", "NON PUO' GIOCARE CON NOI", "E' COLPA DEI GENITORI", "TANTO NON CAPISCE", "E' TROPPO DIVERSO", "NON E' COME GLI ALTRI", "MEGLIO NON INVITARLO", "E' STRANO", "NON SERVE PROVARCI"];

// ---------------------------------------------------------------- audio (SID-like)
let AC = null, MG = null, NB = null, MUTE = false;
function initAudio() { if (AC) { if (AC.state === 'suspended') AC.resume(); return; } try { AC = new (window.AudioContext || window.webkitAudioContext)(); MG = AC.createGain(); MG.gain.value = 0.22; MG.connect(AC.destination); NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } catch (e) { AC = null; } }

const SFX = {
  t() { return AC ? AC.currentTime : 0; },
  blip() { tone(880, this.t(), 0.05, 'square', 0.08); },
  buy() { const t = this.t(); tone(660, t, 0.06, 'square', 0.1); tone(990, t + 0.06, 0.09, 'square', 0.1); },
  no() { tone(140, this.t(), 0.2, 'square', 0.12, 0.7); },

// ------------- the theme song (original melody and lyrics) with karaoke

    rect(236, 50, 60, 110, K.m); rect(242, 58, 48, 70, K.k); for (let i = 0; i < Math.min(12, S.stored); i++) drawRoamer(250 + (i % 4) * 11, 120 - ((i / 4) | 0) * 14 - Math.sin(S.t * 3 + i) * 2, S.t + i); rect(240, 132, 52, 8, K.R); text(String(S.stored), 252, 146, K.k);
    const lines = (this.n ? 'OTTIMO LAVORO! ' + this.n + ' PREGIUDIZI MESSI AL SICURO NEL CONTENITORE.' : 'NIENTE DA SVUOTARE. LE TRAPPOLE SONO VUOTE.') + ' ' + (this.fc ? 'PIENO DI BENZINA: -€' + this.fc + '.' : '');
    wrap('PROF K: ' + lines, 18).forEach((l, i) => text(l, 104, 96 + i * 10, K.b));
    if (S.pk > 6000) text('RIFF: BZZ! LA TORRE E\' CARICA!', 6, 168, K.r);
    rtext(fmt(S.money), 316, 186, K.b); if (((S.t * 2) | 0) % 2) text('FUOCO: TORNA IN CITTA\'', 6, 186, K.r);
  }
};

// ---------------------------------------------------------------- BUSTING (two rays and the trap)
const GY = 178;
const BUST = {
  b: null,
  enter() { const p = pick(PREJ); Object.assign(this, { ph: 'trap', trapX: 160, b1: 30, b2: 290, gx: 160, gy: 60, vx: 0, vy: 0, t: 0, tb: 0, res: null, resT: 0, prej: p, walk: 0, trapOpen: 0, slimed: -1, kick: 0 }); musicVol(MUTE ? 0 : 0.18); },
  update(dt) {
    const B = this; B.t += dt; B.walk += dt;
    if (B.res) { B.resT += dt; if (B.resT > 3 && (pressed('F') || TAP || B.resT > 6)) { go('map'); } return; }
    const mv = (held('R') ? 1 : 0) - (held('L') ? 1 : 0);
    if (B.ph === 'trap' || B.ph === 'b1' || B.ph === 'b2') { // ghost wanders around the facade
      B.gx += Math.cos(B.t * 0.9) * 50 * dt + Math.sin(B.t * 2.3) * 20 * dt; B.gy = 62 + Math.sin(B.t * 1.4) * 30; B.gx = clamp(B.gx, 40, 280);
    }
    if (B.ph === 'trap') { B.trapX = clamp(B.trapX + mv * 70 * dt, 30, 290); if (pressed('F')) { B.ph = 'b1'; SFX.blip(); } }
    else if (B.ph === 'b1') { B.b1 = clamp(B.b1 + mv * 60 * dt, 10, 310); if (pressed('F')) { B.ph = 'b2'; SFX.blip(); } }
    else if (B.ph === 'b2') { B.b2 = clamp(B.b2 + mv * 60 * dt, 10, 310); if (pressed('F')) { if (B.b2 - B.b1 < 22) { this.fail('MAI INCROCIARE I RAGGI!', true); SFX.boom(); return; } B.ph = 'beam'; B.tb = 0; SFX.zap(); } }
    else if (B.ph === 'beam') {
      B.tb += dt; const sp = B.b2 - B.b1; let nb1 = clamp(B.b1 + mv * 55 * dt, 10, 310 - sp); B.b1 = nb1; B.b2 = nb1 + sp;
      const tx = (B.b1 + B.b2) / 2, ty = GY - 26;
      B.kick -= dt; if (B.kick <= 0) { B.kick = rnd(0.35, 0.8); B.vx += rnd(-42, 42); B.vy += rnd(-40, 10); }
      B.vx += (tx - B.gx) * 2.6 * dt; B.vy += (ty - B.gy) * 1.6 * dt; B.vx *= Math.pow(0.35, dt); B.vy *= Math.pow(0.4, dt);
      B.gx += B.vx * dt; B.gy += B.vy * dt; B.gx = clamp(B.gx, 8, 312); B.gy = clamp(B.gy, 20, GY - 10);
      if (Math.random() < dt * 14) SFX.zap();
      for (const [i, bx] of [[0, B.b1], [1, B.b2]]) if (Math.abs(B.gx - bx) < 7 && B.gy > GY - 24) { B.slimed = i; SFX.slime(); this.fail(TEAM[i].n + ' E\' STATO IMPIASTRICCIATO!'); return; }
      if (pressed('F')) { B.trapOpen = 1; SFX.trap(); if (Math.abs(B.gx - B.trapX) < 14 && B.gy > GY - 48) { B.ph = 'suck'; B.ts = 0; } else { this.fail('TRAPPOLA VUOTA: IL PREGIUDIZIO E\' SCAPPATO'); } }
      if (B.tb > 25) this.fail('TROPPO TEMPO: IL PREGIUDIZIO E\' SCAPPATO');
    }
    else if (B.ph === 'suck') { B.ts += dt; B.gx += (B.trapX - B.gx) * dt * 5; B.gy += (GY - 4 - B.gy) * dt * 3; if (B.ts > 1.1) { const pay_ = Math.round((500 + S.pk / 12) / 10) * 10; pay(pay_); S.caught++; if (!S.eq.cont) S.filled++; else S.stored++; S.haunted.delete(B.b.id); B.res = { ok: true, msg: 'PREGIUDIZIO CATTURATO! +' + fmt(pay_) }; SFX.capture(); B.trapOpen = 0; } }
    if (B.trapOpen > 0) B.trapOpen = Math.max(0, B.trapOpen - dt);
  },
  fail(m, boom) { this.res = { ok: false, msg: m, boom }; this.ph = 'fail'; S.haunted.delete(this.b.id); S.pk = Math.min(9999, S.pk + 100); },
  draw() {
    const B = this, bc = B.b ? B.b.col : [K.r, K.R];
    // facade
    rect(0, 0, W, GY, bc[0]); for (let y = 4; y < GY; y += 6) for (let x = ((y / 6) | 0) % 2 ? 0 : 6; x < W; x += 12) rect(x, y, 11, 1, K.k);
    for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) { const x = 14 + c * 52, y = 10 + r * 38; rect(x - 2, y - 2, 28, 26, bc[1]); rect(x, y, 24, 22, (r + c + ((S.t * 2) | 0)) % 7 === 0 ? K.y : K.k); rect(x + 11, y, 2, 22, bc[1]); }
    rect(140, GY - 40, 40, 40, K.k); rect(144, GY - 36, 32, 36, K.n); rect(0, GY, W, H - GY, K.m); rect(0, GY, W, 2, K.l);
    // trap
    const tx = B.trapX; rect(tx - 7, GY - 3, 14, 5, K.d); rect(tx - 7, GY - 3, 14, 1, K.y); rect(tx - 5, GY, 2, 2, K.y); rect(tx + 3, GY, 2, 2, K.y);
    if (B.trapOpen > 0 || B.ph === 'suck') { const hh = B.ph === 'suck' ? 120 : 60 * B.trapOpen; for (let i = 0; i < 8; i++) rect(tx - 8 + i * 2, GY - 3 - hh, 1, hh, i % 2 ? K.w : K.c); }
    if (B.ph === 'trap') { rect(tx - 1, GY - 14, 3, 8, K.y); rect(tx - 3, GY - 9, 7, 2, K.y); }
    // busters
    const fr = held('L') || held('R') ? 1 + (((B.walk * 6) | 0) % 2) : 0;
    const showB1 = B.ph !== 'trap', showB2 = showB1 && B.ph !== 'b1';
    if (showB1) drawBuster(0, B.b1, GY, B.ph === 'b1' ? fr : 0, false, B.slimed === 0);
    if (showB2) drawBuster(1, B.b2, GY, B.ph === 'b2' || B.ph === 'beam' ? fr : 0, true, B.slimed === 1);
    // rays
    if (B.ph === 'beam' || B.ph === 'suck') { [[B.b1 + 5, 0], [B.b2 - 5, 1]].forEach(([x, k]) => { const x0 = x, y0 = GY - 11; const n = 9; let px = x0, py = y0; for (let i = 1; i <= n; i++) { const t = i / n; const nx = x0 + (B.gx - x0) * t + (i < n ? rnd(-4, 4) : 0), ny = y0 + (B.gy - y0) * t + (i < n ? rnd(-4, 4) : 0); line(px, py, nx, ny, [K.y, K.R, K.w, K.o][(i + k + ((S.t * 20) | 0)) % 4]); px = nx; py = ny; } }); }
    // the pregiudizio
    if (B.ph === 'suck') { const s = Math.max(0.1, 1 - B.ts); drawGhost(B.gx, B.gy, S.t, s); }
    else if (B.ph !== 'fail' || !B.res) drawGhost(B.gx, B.gy, S.t, 1, !S.eq.vis);
    if (B.res && !B.res.ok && !B.res.boom && B.slimed < 0) drawGhost(B.gx, B.gy - B.resT * 60, S.t, 1);
    if (B.res && B.res.boom && B.resT < 0.6) { rect(0, 0, W, H, ((B.resT * 20) | 0) % 2 ? K.w : K.R); }
    if (B.slimed >= 0 && B.res) for (let i = 0; i < 8; i++) rect((B.slimed ? B.b2 : B.b1) - 6 + i * 1.6, GY - 20 + ((B.resT * 30 + i * 7) % 18), 2, 3, K.G);
    // texts
    rect(0, 188, W, 12, K.k);
    const tips = { trap: 'METTI LA TRAPPOLA E PREMI FUOCO', b1: 'POSIZIONA SUPER K E PREMI FUOCO', b2: 'POSIZIONA SUPER X E PREMI FUOCO', beam: 'PORTALO SULLA TRAPPOLA: FUOCO LA APRE', suck: 'DENTRO!' };
    if (B.res) { rect(20, 70, 280, 50, K.k); rect(22, 72, 276, 46, B.res.ok ? K.b : K.r); ctext(B.res.msg, 80, K.w); if (B.res.ok) ctext('"' + B.prej + '"', 94, K.y); else ctext('IL PREGIUDIZIO VOLA VERSO LA TORRE', 94, K.l); if (B.resT > 3 && ((S.t * 2) | 0) % 2) ctext('FUOCO', 106, K.c); }
    else ctext(tips[B.ph] || '', 190, K.y);
    if (B.ph === 'beam') { rect(0, 0, W, 10, K.k); text('PREGIUDIZIO: "' + B.prej + '"', 4, 1, K.l); rtext(String(Math.max(0, Math.ceil(25 - B.tb))), 316, 1, K.y); }
  }
};

// ---------------------------------------------------------------- THE TOWER (sneak in under the Giant)
const TOWER_ = {
  enter() { S.msgT = 0; Object.assign(this, { t: 0, i: 0, x: 8, inside: 0, lost: [], squash: 0, gx: 160, prevS: 0, done: null, dT: 0, parts: [], walk: 0 }); musicVol(MUTE ? 0 : 0.25); },
  update(dt) {
    const T = this; T.t += dt;
    if (T.done) { T.dT += dt; T.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 30 * dt; }); if (T.dT > 5 && (pressed('F') || TAP || T.dT > 9)) endGame(T.done); return; }
    T.gx = 160 + Math.sin(T.t * 0.8) * 78; const s = Math.sin(T.t * 2.6); T.jump = Math.abs(s) * 48;
    if (Math.sign(s) !== Math.sign(T.prevS) && T.t > 0.2) { SFX.thump(); T.shake = 0.25; if (T.i < 3 && Math.abs(T.x - T.gx) < 22 && !T.squash) { T.squash = 1; T.lost.push(T.i); say(TEAM[T.i].n + ' E\' STATO SCHIACCIATO!', K.R, 2.5); SFX.slime(); } }
    T.prevS = s; if (T.shake > 0) T.shake -= dt;
    if (T.squash) { T.squash += dt; if (T.squash > 1.6) { T.squash = 0; this.next(); } return; }
    if (T.i < 3) { const mv = (held('R') ? 1 : 0) - (held('L') ? 1 : 0); T.x = clamp(T.x + mv * 48 * dt, 6, 160); if (mv) T.walk += dt; if (T.x >= 158) { T.inside++; SFX.door(); say(TEAM[T.i].n + ' E\' ENTRATO NELLA TORRE!', K.G, 2.5); this.next(); } }
  },
  next() { const T = this; T.i++; T.x = 8; if (T.inside >= 2) { T.done = 'win'; T.dT = 0; SFX.win(); for (let i = 0; i < 70; i++) T.parts.push({ x: T.gx + rnd(-20, 20), y: 100 + rnd(-30, 30), vx: rnd(-60, 60), vy: rnd(-70, -10), c: pick([K.y, K.R, K.c, K.G, K.B, K.o]) }); } else if (T.i >= 3) { T.done = 'lose'; T.dT = 0; SFX.no(); } },
  draw() {
    const T = this; const sh = T.shake > 0 ? rnd(-2, 2) : 0; g.save(); g.translate(0, sh);
    rect(0, -4, W, H + 8, K.k); for (let i = 0; i < 50; i++) rect((i * 97) % W, (i * 31) % 90, 1, 1, i % 4 ? K.m : K.w);
    rect(0, 40, 90, 140, K.b); rect(230, 30, 90, 150, K.b); for (let y = 48; y < 170; y += 12) for (let x = 8; x < 84; x += 14) { rect(x, y, 6, 7, (x + y) % 3 ? K.y : K.k); rect(x + 230, y - 6, 6, 7, (x * y) % 4 ? K.y : K.k); }
    // the tower
    const glow = T.done === 'win' ? (((T.dT * 10) | 0) % 2 ? K.w : K.y) : (((S.t * 3) | 0) % 2 ? K.p : K.R);
    rect(120, 20, 80, 160, K.p); rect(112, 14, 96, 8, K.p); rect(146, 0, 28, 14, glow); for (let y = 30; y < 140; y += 18) { rect(132, y, 10, 12, K.R); rect(178, y, 10, 12, K.R); }
    rect(148, 140, 24, 40, T.done === 'win' ? K.k : glow); rect(144, 136, 32, 4, K.l); for (let i = 0; i < 3; i++) rect(138 - i * 6, 172 + i * 3, 44 + i * 12, 3, K.l);
    rect(0, 180, W, 20, K.m); rect(0, 180, W, 1, K.l);
    if (T.done === 'win') { const k = Math.min(1, T.dT / 1.5); [[100, 180], [220, 180]].forEach(([x, y], j) => { for (let i = 0; i < 12; i++) { const t = i / 12 * k; line(x + (160 - x) * t + rnd(-3, 3), y + (8 - y) * t + rnd(-3, 3), x + (160 - x) * (t + 1 / 12 * k), y + (8 - y) * (t + 1 / 12 * k), [K.y, K.R, K.w][(i + j) % 3]); } }); drawBuster(0, 100, 180, 0, false); drawBuster(1, 220, 180, 0, true); }
    // the Giant of Labels
    if (T.done !== 'win') drawGiant(T.gx, 180 - T.jump, 1, S.t);
    else if (T.dT < 1.2) drawGiant(T.gx, 180, 1 + T.dT * 0.3, S.t, 1);
    T.parts.forEach(p => { rect(p.x, p.y, 4, 3, p.c); rect(p.x + 1, p.y + 1, 2, 1, K.k); });
    // the runner
    if (!T.done && T.i < 3) { if (T.squash) { rect(T.x - 6, 177, 12, 3, TEAM[T.i].S); } else drawBuster(T.i, T.x, 180, held('L') || held('R') ? 1 + (((T.walk * 7) | 0) % 2) : 0, false, false); }
    g.restore();
    rect(0, 0, W, 10, K.k); text('ENTRATI ' + T.inside + '/2', 4, 1, K.G); rtext(T.i < 3 ? 'TOCCA A ' + TEAM[Math.min(2, T.i)].n : '', 316, 1, K.y);
    for (let i = 0; i < 3; i++) { const c = T.lost.includes(i) ? K.d : i < T.i ? K.G : TEAM[i].S; drawBuster(i, 120 + i * 14, 198, 0, false, false, 0.45); if (T.lost.includes(i)) line(115 + i * 14, 190, 125 + i * 14, 198, K.R); }
    if (T.done === 'win') { ctext('LA TORRE DELLO STIGMA SI E\' CHIUSA!', 60, K.y, 1, K.k); if (T.dT > 1.5) ctext('IL GIGANTE E\' SCOPPIATO IN ADESIVI!', 74, K.w, 1, K.k); }
    else if (T.done === 'lose') ctext('NON CE L\'AVETE FATTA A ENTRARE...', 70, K.R, 1, K.k);
    else if (S.msgT > 0) ctext(S.msg, 30, S.msgC); else ctext('CORRI ALLA PORTA QUANDO IL GIGANTE SALTA', 30, K.l);
  }
};

// ---------------------------------------------------------------- ENDINGS
function endGame(kind) { END.kind = kind; go('end'); musicVol(MUTE ? 0 : 0.6); }
const END = {
  kind: 'win',
  update() { if (MODE_T > 2 && (pressed('F') || TAP)) { titleStarted = true; go('title'); musicVol(MUTE ? 0 : 1); } },
  draw() {
    const win = this.kind === 'win'; rect(0, 0, W, H, win ? K.b : K.k);
    if (win) { for (let i = 0; i < 40; i++) { const x = (i * 53 + S.t * 30 * (1 + i % 3)) % W, y = (i * 29 + S.t * 40 * (1 + i % 2)) % H; rect(x, y, 4, 3, [K.y, K.R, K.c, K.G][i % 4]); } }
    const L = win ? ['CONGRATULAZIONI, ' + S.name + '!', '', 'LA TORRE DELLO STIGMA E\' CHIUSA', 'E IL GIGANTE DELLE ETICHETTE', 'E\' DIVENTATO UNA PIOGGIA DI ADESIVI.', '', 'NESSUNO E\' LA SUA ETICHETTA.']
      : this.kind === 'broke' ? ['SEI IN BANCAROTTA, ' + S.name + '.', '', 'LA BANCA HA CHIUSO IL TUO', 'LABORATORIO DEI CUSTODI.', '', 'RIPROVA: I PREGIUDIZI NON', 'SI SCONFIGGONO IN UN GIORNO.']
      : this.kind === 'noprofit' ? ['LA TORRE SI E\' APERTA, MA...', '', 'NON HAI GUADAGNATO PIU\' DI QUANTO', 'TI HA PRESTATO LA BANCA.', 'IL FRANCHISING CHIUDE.', '', 'CATTURA PIU\' PREGIUDIZI LA PROSSIMA VOLTA!']
      : ['IL GIGANTE HA FERMATO I CUSTODI', 'DAVANTI ALLA TORRE.', '', 'MA IL TUO CONTO E\' SALVO:', 'RIPROVA CON PIU\' CORAGGIO!'];
    L.forEach((l, i) => ctext(l, 18 + i * 11, i === 0 ? K.y : K.w, 1, K.k));
    ctext('CATTURATI ' + S.caught + '   ASPIRATI ' + S.vacuumed, 104, K.c);
    ctext('CONTO FINALE ' + fmt(S.money), 120, K.y, 1, K.k);
    if (this.kind !== 'broke') { ctext('NUMERO DI CONTO', 140, K.l); ctext(accountCode(), 152, K.w, 2, K.k); ctext('SCRIVILO PER LA PROSSIMA PARTITA', 172, K.l); }
    if (MODE_T > 2 && ((S.t * 2) | 0) % 2) ctext('FUOCO', 188, K.c);
  }
};
const MODES = { title: TITLE, name: NAME, bank: BANK, car: CAR, shop: SHOP, map: MAP, drive: DRIVE, lab: LAB_, bust: BUST, tower: TOWER_, end: END };

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame); if (window.__PAUSE) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt);
}
function step(dt) {
  pollPad();
  if (pressed('M')) { MUTE = !MUTE; if (MG) MG.gain.value = MUTE ? 0 : 0.22; }
  S.t += dt; MODE_T += dt; if (S.msgT > 0 && !(S.open && S.mode === 'map')) S.msgT -= dt;
  const M = MODES[S.mode]; if (!dlgOpen) M.update(dt);
  musicTick();
  MODES[S.mode].draw(); clearPress();
}
requestAnimationFrame(frame);
// test hooks
window.GB = { S, go, step, BUST, TOWER_, DRV, startDrive, enterBuilding, BLD, resetGame, openTower, KD, TP, TD, set: (k, v) => { TD[k] = v; }, press: k => { TP[k] = true; } };
</script>
