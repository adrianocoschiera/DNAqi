<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Il Padrone dei Sogni</title>
<style>
:root{--bg:#060418;--ink:#e8ecff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060418;--ink:#e8ecff}}
:root[data-theme="dark"]{--bg:#060418;--ink:#e8ecff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#141038 0%,#060418 70%)}
canvas#game{display:block;background:#000;box-shadow:0 0 60px #3a1d7a55}
#touch{display:none;position:fixed;inset:0;pointer-events:none}
#touch .b{position:absolute;pointer-events:auto;touch-action:none;border:3px solid #ffffffb0;color:#fff;font:900 22px/1 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#1b2f7acc;box-shadow:0 4px 0 #0008;opacity:.6}
#touch .b.on{transform:translateY(3px);box-shadow:none;opacity:1}
#dpad{position:absolute;left:14px;bottom:14px;width:150px;height:150px;pointer-events:auto;touch-action:none}
#dpad div{position:absolute;width:50px;height:50px;background:#1b2f7acc;border:3px solid #ffffffb0;color:#fff;display:flex;align-items:center;justify-content:center;font:900 20px system-ui;border-radius:10px;opacity:.6}
#dpad .on{background:#3d63e0}
#tu{left:50px;top:0}#td{left:50px;top:100px}#tl{left:0;top:50px}#tr{left:100px;top:50px}
#bJ{right:20px;bottom:30px;width:96px;height:96px;font-size:16px!important;background:#c9782acc!important}
#bS{right:98px;bottom:20px;width:74px;height:74px;background:#2c96d6cc!important}
#bB{right:98px;bottom:104px;width:56px;height:56px;background:#7c3fc4cc!important;font-size:16px}
#bP{right:14px;bottom:104px;width:56px;height:56px;background:#d9a91ecc!important;font-size:16px}
#bPause{right:12px;top:12px;width:44px;height:44px;border-radius:10px!important;font-size:16px}
@media (pointer:coarse){#touch{display:block}}
</style>
</head>

</div>

<script>
'use strict';
// ================= CORE =================
const W = 256, H = 240;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
const SCALE = 4; ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'low';
const QS = new URLSearchParams(location.search);

function fit() {
  const sw = innerWidth, sh = innerHeight;
  let s = Math.min(sw / W, sh / H);
  const si = Math.floor(s);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- deterministic rng ----------
function hash(n) { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
let seed = 1;
function srand(s) { seed = s >>> 0 || 1; }
function rnd() { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; }
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- canvas helpers ----------
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function fromMap(rows, pal) {
  const h = rows.length, w = rows[0].length;
  const [c, g] = mkCanvas(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    const col = pal[ch]; if (!col) continue; g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  return c;
}
function tint(src, col) {
  const [c, g] = mkCanvas(src.width, src.height);
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  return c;
}
// filled pixel circle
function pcirc(g, cx, cy, r, col) {
  g.fillStyle = col; cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -r; y <= r; y++) { const hw = Math.floor(Math.sqrt(r * r - y * y + r * 0.6)); g.fillRect(cx - hw, cy + y, hw * 2 + 1, 1); }
}
function pring(g, cx, cy, r, col) {

// ---------- enemies ----------

function updateIncubo() {

function update() {

    case 'play': updatePlay(); break;
    case 'pause': if (pressed.pause || pressed.start) state = 'play'; break;

      if (winT > 70 && incubo) { incubo.pose = 'roar'; incubo.y -= 1.2; if (sheepPos) { sheepPos.x += (incubo.x - sheepPos.x) * 0.1; sheepPos.y = incubo.y - 20; } }

      else { incubo.fallen = true; incubo.pose = 'idle'; incubo.y = 232; }
      if (stT === 140) { Audio_.sfx('bigboom'); for (const s of segs) if (s !== bottomSeg) s.hidden = false; }
      if (stT > 160 && sheepPos) { sheepPos.y = Math.min(sheepPos.y + 1.2, sy(bottomSeg, sheepPos.x)); sheepPos.x += (player.x + 14 - sheepPos.x) * 0.03; }

      if (state === 'win' && winT > 90) { hudPanel(56, 100, 144, 40, 9); txt('BRAVO!', W / 2, 103, '#ffd23a', { align: 'center', size: 15, out: INK, outW: 2.4, grad: ['#fff8c8', '#ffd23a'] }); txt('BONUS ' + bonus, W / 2, 123, '#ffffff', { align: 'center', size: 9 }); }
      if (state === 'collapse' && stT > 200) { ctx.save(); ctx.translate(player.x + 8, player.y - 36); ctx.scale(1.6, 1.6); ctx.drawImage(SP.heart, -3.5, -3.5); ctx.restore(); bigBanner('SOGNI D\'ORO!', 100, T % 10 < 5 ? '#ffffff' : '#ffd23a', 2); }
      if (state === 'pause') { ctx.fillStyle = 'rgba(5,4,26,0.65)'; ctx.fillRect(0, 0, W, H); bigBanner('PAUSA', 90, '#ffe46a', 2); txt('P PER CONTINUARE - M AUDIO', W / 2, 120, '#ffffff', { font: 'small', align: 'center' }); }
      if (state === 'gameover') { ctx.fillStyle = 'rgba(5,4,26,0.6)'; ctx.fillRect(0, 0, W, H); hudPanel(30, 82, 196, 60, 10); bigBanner('GAME OVER', 92, '#ff6a8a', 2); txt('IL SOGNO RICOMINCIA... PREMI INVIO', W / 2, 124, '#ffffff', { font: 'small', align: 'center' }); }

}
let acc = 0, last = performance.now();
function frame(now) { acc += Math.min(100, now - last); last = now; let n = 0; while (acc >= 1000 / 60 && n < 5) { update(); acc -= 1000 / 60; n++; } draw(); requestAnimationFrame(frame); }
(async function boot() {
  requestAnimationFrame(frame);
  await loadFonts(); buildDreamSprites(); buildTitle(); goTitle();
  if (QS.has('lvl')) { level = clamp(parseInt(QS.get('lvl')) - 1, 0, 2); easy = !QS.has('hard'); lives = 5; startLevel(); }
  if (QS.has('story')) startStory(STORY[QS.get('story')], goTitle);
  if (QS.has('end')) { state = 'end'; }
  window.GAME = { get state() { return state; }, get player() { return player; }, get clocks() { return clocks; }, get ghosts() { return ghosts; }, get rivets() { return rivets; }, get level() { return level; }, get lives() { return lives; }, get score() { return score; }, keys, ladders: () => ladders, segs: () => segs, set god(v) { window.__god = v; } };
})();

// ================= HD: background, girders, ladders =================
const SKY = [['#070620', '#141048', '#2a1e70', '#4a2e8a'], ['#05102a', '#0c2450', '#1a4078', '#3a6aa0'], ['#0c0420', '#1e0a3c', '#3a1460', '#6a2a7a']];
function skyLayer(g, lv, h = H) {
  const s = SKY[lv] || SKY[0];
  g.fillStyle = lin(g, 0, 0, 0, h, s.map((c, i) => [i / (s.length - 1), c])); g.fillRect(0, 0, W, h);
  srand(77 + lv);
  // nebula glows
  for (let i = 0; i < 4; i++) glow(g, rnd() * W, 40 + rnd() * 140, 50 + rnd() * 40, ['#8a5aff', '#3a8aff', '#ff5aa8', '#5af0d0'][(i + lv) % 4], 0.12);
  for (let i = 0; i < 150; i++) { const x = rnd() * W, y = rnd() * h * 0.9, r = rnd() * 0.6 + 0.2; g.globalAlpha = 0.35 + rnd() * 0.65; ovl(g, x, y, r, r, rnd() < 0.2 ? '#ffe0a0' : '#e0e8ff'); } g.globalAlpha = 1;
  for (let i = 0; i < 8; i++) { const x = rnd() * W, y = rnd() * 150; pstar(g, x, y, 1.6, 'rgba(255,240,200,0.85)', rnd()); glow(g, x, y, 4, '#fff0c0', 0.3); }
  // crescent moon
  glow(g, 224, 58, 34, '#ffe9a0', 0.25);
  moonP(g, 224, 58, 13); g.fillStyle = radg(g, 218, 52, 1, 15, [[0, '#fff8d8'], [1, '#f0c850']], 224, 58); g.fill();
  for (const [x, y, r] of [[218, 63, 1.6], [214, 54, 1.1], [220, 48, 0.8]]) ovl(g, x, y, r, r, 'rgba(200,150,40,0.4)');
  // sleepy moon face
  g.strokeStyle = '#a8781a'; g.lineWidth = 0.7; g.lineCap = 'round'; g.beginPath(); g.moveTo(214.5, 56); g.quadraticCurveTo(216, 57.2, 217.5, 56); g.stroke();
  // soft clouds at bottom
  for (let L = 0; L < 2; L++) for (let i = 0; i < 9; i++) { const x = i * 32 + (L * 16) + rnd() * 8; const y = h - 22 + L * 10; ovl(g, x, y, 22, 12, L ? ra(s[1], 1) : ra(s[2], 0.9)); }
  // dream houses
  for (let i = 0; i < 6; i++) {
    const x = 10 + i * 44, y = h - 26; g.fillStyle = shade(s[0], 1.15);
    g.beginPath(); g.moveTo(x - 3, y); g.lineTo(x + 9, y - 10); g.lineTo(x + 21, y); g.closePath(); g.fill(); g.fillRect(x, y, 18, 26);
    rr(g, x + 12, y - 9, 3, 6, 0.6); g.fill();
    const lit = i % 2 === 0; if (lit) glow(g, x + 8, y + 10, 10, '#ffd27a', 0.35);
    rr(g, x + 5.5, y + 7, 5, 5, 1); g.fillStyle = lit ? '#ffd27a' : '#5a4a9a'; g.fill(); pline(g, x + 8, y + 7, x + 8, y + 12, shade(s[0], 1.15), 0.5);
  }
}
function renderStatic() {
  const [c, g] = hdC(W, H, 4);
  skyLayer(g, level);
  bgLayer = hdC(W, H, 4)[0]; bgLayer.getContext('2d').drawImage(c, 0, 0);
  for (const l of ladders) drawLadder(g, l.x, l.yTop, l.yBot);
  for (const s of segs) if (!s.elev && !s.hidden) drawSeg(g, s);
  staticLayer = c;
}
function drawLadder(g, x, yTop, yBot) {
  const rail = level === 1 ? '#f0f6ff' : level === 2 ? '#ffd27a' : '#c8b8ff', rung = level === 1 ? '#a8c4ee' : level === 2 ? '#d0982a' : '#9a86e8';
  g.save(); g.lineCap = 'round';
  for (let y = yTop + 3; y < yBot; y += 4) { pline(g, x - 3.6, y + 0.4, x + 3.6, y + 0.4, INK, 1.8); pline(g, x - 3.6, y, x + 3.6, y, rung, 1); }
  for (const sx of [-4.2, 4.2]) { pline(g, x + sx, yTop, x + sx, yBot, INK, 2.2); pline(g, x + sx, yTop, x + sx, yBot, rail, 1.2); pline(g, x + sx - 0.3, yTop, x + sx - 0.3, yBot, 'rgba(255,255,255,0.5)', 0.4); }
  g.restore();
}
function drawSeg(g, s) {
  const x1 = s.x1, x2 = s.x2, y1 = sy(s, x1), y2 = sy(s, x2);
  g.save();
  if (s.cloud || s.elev) {
    const th = 7;
    // fluffy cloud: bumps along top + rounded slab
    g.beginPath(); rr(g, x1, Math.min(y1, y2), x2 - x1, th, 3.5);
    for (let x = x1 + 3; x < x2 - 2; x += 6) { g.moveTo(x + 3.6, sy(s, x) + 1.5); g.arc(x, sy(s, x) + 1.5, 3.6, 0, Math.PI * 2); }
    g.fillStyle = INK; g.save(); g.translate(0, 0.8); g.fill(); g.restore();
    g.fillStyle = lin(g, 0, y1 - 2, 0, y1 + th, [[0, '#ffffff'], [0.6, '#dce4ff'], [1, '#98a8e0']]); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.8)'; for (let x = x1 + 3; x < x2 - 2; x += 6) { ovl(g, x - 1, sy(s, x) - 0.2, 1.6, 0.8); g.fill(); }
  } else {
    const th = 7.4, gold = s.star;
    const top = gold ? '#ffe08a' : '#b8a0ff', mid = gold ? '#d8982a' : '#6a48c8', bot = gold ? '#8a5a14' : '#2a1868';
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x2, y2 + th); g.lineTo(x1, y1 + th); g.closePath();
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.save(); g.translate(0, 2); g.fill(); g.restore();
    g.fillStyle = lin(g, 0, Math.min(y1, y2), 0, Math.min(y1, y2) + th, [[0, top], [0.25, mid], [1, bot]]); g.fill();
    g.lineWidth = 0.8; g.strokeStyle = INK; g.stroke();
    g.clip();
    // flanges
    g.beginPath(); g.moveTo(x1, y1 + 1.6); g.lineTo(x2, y2 + 1.6); g.moveTo(x1, y1 + th - 1.6); g.lineTo(x2, y2 + th - 1.6); g.strokeStyle = ra(bot, 0.7); g.lineWidth = 0.6; g.stroke();
    g.beginPath(); g.moveTo(x1, y1 + 0.6); g.lineTo(x2, y2 + 0.6); g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 0.7; g.stroke();
    // lattice
    g.beginPath(); for (let x = Math.floor(x1 / 8) * 8; x < x2; x += 8) { const ya = sy(s, x), yb = sy(s, x + 4); g.moveTo(x, ya + 2.2); g.lineTo(x + 4, yb + th - 2.2); g.lineTo(x + 8, sy(s, x + 8) + 2.2); }
    g.strokeStyle = ra(bot, 0.85); g.lineWidth = 0.8; g.stroke();
    // bolts: little stars / moons
    for (let x = Math.floor(x1 / 16) * 16 + 4; x < x2; x += 16) { const y = sy(s, x) + th / 2; if (gold) pstar(g, x, y, 1.3, '#fff4c0'); else { ovl(g, x, y, 1.1, 1.1, '#ffe080'); ovl(g, x - 0.3, y - 0.3, 0.4, 0.4, '#fff'); } }
  }
  g.restore();
}
