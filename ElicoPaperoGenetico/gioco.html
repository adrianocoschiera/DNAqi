<style>
:root{--bg:#060418;--ink:#e8ecff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060418;--ink:#e8ecff}}
:root[data-theme="dark"]{--bg:#060418;--ink:#e8ecff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#141038 0%,#060418 70%)}
canvas#game{display:block;background:#000;box-shadow:0 0 60px #3a1d7a55}
#touch{display:none;position:fixed;inset:0;pointer-events:none}
#touch .b{position:absolute;pointer-events:auto;touch-action:none;border:3px solid #ffffffb0;color:#fff;font:900 22px/1 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#1b2f7acc;box-shadow:0 4px 0 #0008;opacity:.6}
#touch .b.on{transform:translateY(3px);box-shadow:none;opacity:1}
#dpad{position:absolute;left:14px;bottom:14px;width:150px;height:150px;pointer-events:auto;touch-action:none}
#dpad div{position:absolute;width:50px;height:50px;background:#1b2f7acc;border:3px solid #ffffffb0;color:#fff;display:flex;align-items:center;justify-content:center;font:900 20px system-ui;border-radius:10px;opacity:.6}
#dpad .on{background:#3d63e0}
#tu{left:50px;top:0}#td{left:50px;top:100px}#tl{left:0;top:50px}#tr{left:100px;top:50px}
#bJ{right:14px;bottom:60px;width:80px;height:80px;font-size:14px!important;background:#c9782acc!important}
#bS{right:100px;bottom:20px;width:78px;height:78px;font-size:14px!important;background:#2c96d6cc!important}
#bB{right:98px;bottom:104px;width:56px;height:56px;background:#7c3fc4cc!important;font-size:16px}
#bP{right:14px;bottom:104px;width:56px;height:56px;background:#d9a91ecc!important;font-size:16px}
#bPause{right:12px;top:12px;width:44px;height:44px;border-radius:10px!important;font-size:16px}
@media (pointer:coarse){#touch{display:block}}
</style>

<script>
'use strict';
// ================= CORE =================
const W = 320, H = 192;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
const SCALE = 4; ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
const QS = new URLSearchParams(location.search);

function fit() {
  const sw = innerWidth, sh = innerHeight;
  let s = Math.min(sw / W, sh / H);
  const si = Math.floor(s);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- deterministic rng ----------
function hash(n) { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
let seed = 1;
function srand(s) { seed = s >>> 0 || 1; }
function rnd() { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; }
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- canvas helpers ----------
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function fromMap(rows, pal) {
  const h = rows.length, w = rows[0].length;
  const [c, g] = mkCanvas(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    const col = pal[ch]; if (!col) continue; g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  return c;
}
function tint(src, col) {
  const [c, g] = mkCanvas(src.width, src.height);
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  return c;
}
// filled pixel circle
function pcirc(g, cx, cy, r, col) {
  g.fillStyle = col; cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -r; y <= r; y++) { const hw = Math.floor(Math.sqrt(r * r - y * y + r * 0.6)); g.fillRect(cx - hw, cy + y, hw * 2 + 1, 1); }
}
function pring(g, cx, cy, r, col) {

function drawOver() { jungleBG(); txt('Game Over', W / 2, 46, '#ff8a9a', { size: 22, align: 'center', out: INK, outW: 3.6 }); ctx.save(); ctx.translate(W / 2, 132); ctx.scale(1.4, 1.4); drawElico(0, 0, 1, 'hurt', T); ctx.restore(); txt('Riprovi da questo mondo?  ' + Math.max(0, 9 - Math.floor(stT / 60)), W / 2, 146, '#ffffff', { size: 8, align: 'center', out: INK, outW: 1.6 }); txt('INVIO o tocca', W / 2, 160, '#c8ffe8', { size: 6.5, align: 'center' }); }
function drawEnding() {
  jungleBG(); drawParts(); if (stT % 80 === 1) confetti(40);
  panel(16, 6, 288, 62);
  ['Tutti i Custodi sono liberi!', 'Il Grigiotron ha ritrovato i colori e ora fa il giardiniere.', 'Elico ha capito che essere diversi è un superpotere:', 'nessun DNA è uguale a un altro... nemmeno quello di un papero!'].forEach((s, i) => { if (stT > i * 40) txt(s, W / 2, 11 + i * 12 + (i ? 3 : 0), i ? '#ffffff' : '#ffe46a', { size: i ? 6.3 : 10, align: 'center', w: i ? 600 : 700 }); });
  ctx.save(); ctx.translate(W / 2, 186); ctx.scale(1.6, 1.6); drawElico(0, 0, 1, 'wave', T, { happy: true }); ctx.restore();
  ['riff', 'lenticchia', 'xia'].forEach((f, i) => drawFriend(f, 34 + i * 34, 186, 1, T + i * 30, true)); ['samuel', 'superk', 'fragile'].forEach((f, i) => drawFriend(f, 218 + i * 34, 186, 1, T + i * 30, true));
  for (let i = 0; i < 4; i++) drawGenino(110 + i * 34, 124 + Math.sin(T * 0.08 + i) * 4, i, T + i * 9, true);
  if (stT > 220) { txt('Fine', W / 2, 70, '#ffe46a', { size: 16, align: 'center', out: INK }); txt('punti ' + G.score + '  ·  geni liberati ' + G.geni, W / 2, 94, '#ffffff', { size: 7, align: 'center', out: INK, outW: 1.4 }); }
}
// ---------- loop ----------
function update() {
  pollInput(); T++; stT++; if (fade > 0) fade = Math.max(0, fade - 0.05);
  if (pressed.mute) Audio_.toggleMute();
  switch (state) {
    case 'title': titleUpdate(); break;
    case 'story': if (stT > 30 && okP()) { newSession(easyMode.on); G.cp = false; goState('intro'); introNext = () => loadLevel(0); } break;
    case 'controls': if (stT > 10 && (okP() || kp('Escape'))) goState('title'); break;
    case 'intro': if (stT > 150 || (stT > 40 && okP())) { introNext(); goState('play'); } break;
    case 'play':
      if (paused) { if (pressed.pause || pressed.start) paused = false; else if (kp('KeyQ')) { paused = false; goState('title'); Audio_.music('title'); } break; }
      if (pressed.pause) { paused = true; Audio_.sfx('select'); break; }
      gameStep(); break;
    case 'card': if (stT > 40 && okP()) { G.cp = false; goState('intro'); introNext = () => loadLevel(G.lvl + 1); } break;
    case 'over': if (stT > 40 && okP()) { G.lives = G.easy ? 5 : 3; G.score = Math.floor(G.score / 2); goState('intro'); introNext = () => loadLevel(G.lvl, G.cp); } else if (stT > 600) { goState('title'); Audio_.music('title'); } break;
    case 'ending': updateParts(); if (stT > 300 && okP()) { goState('title'); Audio_.music('title'); } break;
  }
  for (const k in keys) kPrev[k] = keys[k]; kPrev.__st = !!touchState.start;
}
function draw() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = '#0e2a2a'; ctx.fillRect(0, 0, W, H);
  if (state === 'boot') return;
  switch (state) {
    case 'title': drawTitle(); break; case 'story': drawStory(); break; case 'controls': drawControls(); break;
    case 'intro': drawIntro(); break; case 'play': drawGame(); break; case 'card': drawCard(); break; case 'over': drawOver(); break; case 'ending': drawEnding(); break;
  }
  if (fade > 0) { ctx.fillStyle = `rgba(8,30,30,${fade})`; ctx.fillRect(0, 0, W, H); }
}
let acc = 0, last = performance.now(), fast = 1;
function frame(now) { acc += Math.min(100, now - last) * fast; last = now; let n = 0; while (acc >= 1000 / 60 && n < 4 * fast) { update(); acc -= 1000 / 60; n++; } if (acc > 1000) acc = 0; draw(); requestAnimationFrame(frame); }
(async function boot() {
  requestAnimationFrame(frame);
  await loadFonts();
  goState('title'); Audio_.music('title');
  window.GAME = {
    get state() { return state; }, get P() { return P; }, get L() { return L; }, get G() { return G; }, get ents() { return ents; }, get phase() { return phase; }, get camX() { return camX; }, get boss() { return bossE; }, keys, inp, pressed,
    start(lvl = 0, easy = true) { newSession(easy); loadLevel(lvl); goState('play'); fade = 0; }, step(n = 1) { for (let i = 0; i < n; i++) update(); }, set fast(v) { fast = v; }, goState
  };
})();

</script>
