:root{--bg:#e9f8ff;--ink:#2a3a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#e9f8ff;--ink:#2a3a8a}}
:root[data-theme="dark"]{--bg:#e9f8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Fredoka,"Arial Rounded MT Bold",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;display:block}
#set{position:fixed;inset:0;background:rgba(20,30,70,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;touch-action:auto}
#set .pan{background:#fff;border-radius:22px;padding:18px 20px;max-width:720px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);font-family:system-ui,sans-serif;color:#223}
#set h2{margin:0 0 6px;font-family:Fredoka,sans-serif;color:#2a3a8a}#set h3{margin:14px 0 6px;color:#2a5aa0}
.ani{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.an{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px;background:#eef6ff;font-size:16px}
.an .em{font-size:26px;font-family:ScatoleEmoji,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.opt{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:16px;flex-wrap:wrap}
.opt select{font-size:16px;padding:6px;border-radius:8px}
input[type=checkbox]{width:22px;height:22px}
.note{font-size:13px;color:#556;margin:10px 0}
.btns button{font-family:Fredoka,sans-serif;font-size:20px;border:0;border-radius:999px;padding:10px 28px;background:#2fae5a;color:#fff;cursor:pointer}
</style>

  g.fillStyle = 'rgba(255,255,255,0.95)'; for (const [cx, cy, s] of [[120, 90, 1], [VW * 0.5, 60, 0.8], [VW * 0.75, 130, 0.7]]) { const x = (cx + t * 12 * s) % (VW + 200) - 100; for (const [dx, dy, r] of [[0, 0, 30], [32, -12, 38], [66, 0, 30]]) { g.beginPath(); g.arc(x + dx * s, cy + dy * s, r * s, 0, 7); g.fill(); } }
}
function drawBubble() {
  if (!S.bubble) return; const fs = clamp(Math.min(VW, VH) * 0.06, 22, 46); g.save(); g.font = `700 ${fs}px Fredoka, "Arial Rounded MT Bold", sans-serif`; const tw = Math.min(g.measureText(S.bubble).width, VW - 60);
  const bw = tw + fs * 1.4, bh = fs * 1.7, bx = VW / 2 - bw / 2, by = Math.min(24, VH * 0.03) + 8; rr(bx, by, bw, bh, bh / 2); g.fillStyle = '#ffffff'; g.shadowColor = 'rgba(0,0,60,0.2)'; g.shadowBlur = 16; g.fill(); g.shadowBlur = 0; g.lineWidth = 4; g.strokeStyle = '#7ac0ff'; g.stroke();
  g.fillStyle = '#2a3a8a'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(S.bubble, VW / 2, by + bh / 2 + 1, VW - 70); g.restore();
}
function drawStars() { const n = Math.min(S.streak, 10); for (let i = 0; i < n; i++) { const x = 28 + i * 34, y = VH - 30; g.save(); g.translate(x, y); g.fillStyle = '#ffd84d'; g.strokeStyle = '#c98a10'; g.lineWidth = 2; g.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 6 : 14; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); g.fill(); g.stroke(); g.restore(); } }
function drawGear() { g.save(); g.globalAlpha = 0.45 + gearHold * 0.5; g.fillStyle = '#4a6aa0'; g.beginPath(); g.arc(VW - 34, VH - 34, 20, 0, 7); g.fill(); g.fillStyle = '#fff'; g.font = '22px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('⚙', VW - 34, VH - 33); if (gearHold > 0) { g.strokeStyle = '#ffe36b'; g.lineWidth = 4; g.beginPath(); g.arc(VW - 34, VH - 34, 24, -Math.PI / 2, -Math.PI / 2 + gearHold * Math.PI * 2); g.stroke(); } g.restore(); }
function drawStart(t) {
  drawBg(t); const s = Math.min(VW, VH) * 0.42; g.save(); const fs = clamp(Math.min(VW, VH) * 0.08, 28, 64); g.font = `700 ${fs}px Fredoka, sans-serif`; g.textAlign = 'center'; g.fillStyle = '#2a3a8a'; g.fillText('Le scatole trasparenti', VW / 2, VH * 0.18); g.restore();
  emoji('🐕', VW / 2 - s * 0.45, VH * 0.48 + Math.sin(t * 3) * 8, s * 0.5); emoji('🐄', VW / 2 + s * 0.45, VH * 0.48 + Math.sin(t * 3 + 1) * 8, s * 0.5);
  const r = Math.min(VW, VH) * 0.11; const cx = VW / 2, cy = VH * 0.78; g.save(); g.fillStyle = '#2fd06a'; g.shadowColor = 'rgba(0,80,0,0.35)'; g.shadowBlur = 20; g.beginPath(); g.arc(cx, cy, r * (1 + Math.sin(t * 4) * 0.04), 0, 7); g.fill(); g.shadowBlur = 0; g.fillStyle = '#fff'; g.beginPath(); g.moveTo(cx - r * 0.3, cy - r * 0.45); g.lineTo(cx + r * 0.5, cy); g.lineTo(cx - r * 0.3, cy + r * 0.45); g.fill(); g.restore();
}
// ---------- greeting: "Ciao Diana! Oggi è ..." ----------
const GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const DAYCOL = ['#ff5a5a', '#ff9f2e', '#ffd12e', '#4fc85a', '#3db8ff', '#5a6aff', '#b06bff'];
function today() { const d = new Date(); return { g: GIORNI[d.getDay()], n: d.getDate(), m: MESI[d.getMonth()], i: d.getDay() }; }
function hello() {
  if (S.state === 'hello') return; S.state = 'hello'; S.helloT = 0; audio(); play('chirp'); const d = today(); const name = (SET.name || '').trim();
  const msg = 'Ciao' + (name ? ' ' + name : '') + '! Oggi è ' + d.g + ', ' + (d.n === 1 ? 'primo' : d.n) + ' ' + d.m + '.';
  let started = false; const go = () => { if (started) return; started = true; S.state = 'go'; speak('Giochiamo con le scatole trasparenti!', () => newRound()); setTimeout(() => { if (S.state === 'go') newRound(); }, 4500); };
  speak(msg, () => setTimeout(go, 600)); setTimeout(() => { if (S.state === 'hello') go(); }, 9000);
}
function drawHello(t) {
  drawBg(t); const d = today(); const name = (SET.name || '').trim(); const m = Math.min(VW, VH); const k = clamp(S.helloT * 2.5, 0, 1);
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle';
  emoji('👋', VW / 2 - m * 0.34, VH * 0.2 + Math.sin(t * 8) * 6, m * 0.13);
  g.font = `700 ${clamp(m * 0.12, 34, 96)}px Fredoka, sans-serif`; g.fillStyle = '#2a3a8a'; g.fillText('Ciao' + (name ? ' ' + name : '') + '!', VW / 2 + m * 0.05, VH * 0.2);
  // calendar card
  const cw = Math.min(VW * 0.6, m * 0.75), ch = cw * 0.72, cx = VW / 2 - cw / 2, cy = VH * 0.36 + (1 - k) * 60; g.globalAlpha = k;
  g.shadowColor = 'rgba(0,0,60,0.25)'; g.shadowBlur = 24; rr(cx, cy, cw, ch, 28); g.fillStyle = '#ffffff'; g.fill(); g.shadowBlur = 0;
  g.save(); rr(cx, cy, cw, ch * 0.3, 28); g.clip(); g.fillStyle = DAYCOL[d.i]; g.fillRect(cx, cy, cw, ch * 0.3); g.restore();
  g.font = `700 ${ch * 0.15}px Fredoka, sans-serif`; g.fillStyle = '#ffffff'; g.fillText('Oggi è ' + d.g, VW / 2, cy + ch * 0.155);
  g.font = `700 ${ch * 0.42}px Fredoka, sans-serif`; g.fillStyle = DAYCOL[d.i]; g.fillText(String(d.n), VW / 2, cy + ch * 0.6);
  g.font = `700 ${ch * 0.13}px Fredoka, sans-serif`; g.fillStyle = '#2a3a8a'; g.fillText(d.m, VW / 2, cy + ch * 0.88);
  g.restore();
}
// ---------- loop ----------
let last = performance.now(), gearHold = 0, gearDown = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; S.t += dt;
  if (S.state === 'start') drawStart(S.t);
  else if (S.state === 'hello') { S.helloT += dt; drawHello(S.t); }
  else {
    drawBg(S.t);
    for (const bx of S.boxes) { bx.shake = Math.max(0, bx.shake - dt * 1.6); bx.glow = Math.max(0, bx.glow - dt * 0.25); if (bx.opening) { bx.open = Math.min(1, bx.open + dt * 2.2); bx.pop = Math.min(1, bx.pop + dt * 0.5); } drawBox(bx, S.t); }
    for (const c of S.conf) { c.t += dt; c.vy += 1400 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.r += dt * 6; g.save(); g.translate(c.x, c.y); g.rotate(c.r); g.fillStyle = c.c; g.fillRect(-6, -3, 12, 6); g.restore(); } S.conf = S.conf.filter(c => c.t < 2.5 && c.y < VH + 40);
    drawBubble(); drawStars();
    if (S.state === 'reward' && S.wait < 99) { S.wait -= dt; if (S.wait <= 0) newRound(); }
    if (S.state === 'ask' && S.canTap) { S.hintT += dt; if (S.hintT > 12) { S.hintT = 0; speak('Dov\'è ' + the(S.target) + '?'); } }
  }
  if (gearDown) { gearHold += dt / 2; if (gearHold >= 1) { gearDown = false; gearHold = 0; openSettings(); } } else gearHold = Math.max(0, gearHold - dt * 2);
  drawGear();
  requestAnimationFrame(frame);
}
// ---------- input: touch / mouse / two switches (keys) ----------
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); const x = e.clientX, y = e.clientY;
  if (Math.hypot(x - (VW - 34), y - (VH - 34)) < 30) { gearDown = true; return; }
  if (S.state === 'start') { hello(); return; }
  if (SET.input !== 'tocco' && SET.input !== 'entrambi') return;
  S.boxes.forEach((b, i) => { const R = boxRect(i); if (x > R.x - 20 && x < R.x + R.s + 20 && y > R.y - 20 && y < R.y + R.s + 20) choose(i); });
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, () => { gearDown = false; }));
addEventListener('keydown', e => {
  audio(); if (S.state === 'start') { hello(); return; }
  // two big switches / keyboard: left = box 1, right = box 2
  const left = ['ArrowLeft', 'KeyA', 'Digit1', 'Numpad1', 'Space'].includes(e.code), right = ['ArrowRight', 'KeyL', 'Digit2', 'Numpad2', 'Enter'].includes(e.code);
  if (S.boxes.length === 1 && (left || right)) choose(0); else if (left) choose(0); else if (right) choose(1);
});
// ---------- parents' settings (hold the gear for 2 seconds) ----------
function openSettings() {
  let ov = document.getElementById('set'); if (ov) ov.remove(); ov = document.createElement('div'); ov.id = 'set';
  const chk = (id, label, on) => `<label class="opt"><input type="checkbox" data-a="${id}" ${on ? 'checked' : ''}> ${label}</label>`;
  ov.innerHTML = `<div class="pan"><h2>Impostazioni per mamma e papà</h2>
  <label class="opt">Nome della bambina: <input type="text" data-k="name" value="${(SET.name || '').replace(/"/g, '&quot;')}" style="font-size:18px;padding:6px 10px;border-radius:8px;border:1px solid #9ab"></label>
  <h3>Animali in gioco</h3><div class="ani">${ANIMALS.map(a => `<label class="an"><input type="checkbox" data-id="${a.id}" ${SET.animals.includes(a.id) ? 'checked' : ''}><span class="em">${a.e}</span>${a.name}</label>`).join('')}</div>

  <label class="opt">Si sceglie con: <select data-k="input"><option value="tocco" ${SET.input === 'tocco' ? 'selected' : ''}>tocco sullo schermo</option><option value="tasti" ${SET.input === 'tasti' ? 'selected' : ''}>due pulsanti / sensori (sinistra e destra)</option><option value="entrambi" ${SET.input === 'entrambi' ? 'selected' : ''}>tutti e due</option></select></label>
  ${chk('voice', 'Voce che fa la domanda e dà il premio', SET.voice)}
  <h3>La voce</h3>
  <label class="opt">Voce: <select data-k="voiceName"><option value="">Automatica (la più dolce disponibile)</option>${itVoices().map(v => `<option value="${v.name.replace(/"/g, '&quot;')}" ${SET.voiceName === v.name ? 'selected' : ''}>${v.name}</option>`).join('')}</select></label>
  <label class="opt">Lentezza: più lenta <input type="range" min="0.6" max="1.1" step="0.02" data-k="rate" value="${SET.rate || 0.82}"> più veloce</label>
  <label class="opt">Tono: più basso <input type="range" min="0.8" max="1.5" step="0.05" data-k="pitch" value="${SET.pitch || 1.1}"> più alto</label>
  <div class="btns" style="margin:4px 0 8px"><button id="sTry" style="background:#3d86ff">Prova la voce</button></div>
  <p class="note">Le voci dipendono dal dispositivo. Le più dolci e naturali: su iPad "Alice (Avanzata)" o "Federica" (da scaricare in Impostazioni › Accessibilità › Contenuto letto › Voci › Italiano); su Windows con Edge "Microsoft Elsa/Isabella Online (Natural)"; su Android le voci Google in italiano (Impostazioni › Sintesi vocale).</p>
  ${chk('song', 'Premio con canzoncina e filastrocca (se spento: solo verso dell\'animale)', SET.song)}
  ${chk('errorless', 'Aiuto se sbaglia: la scatola giusta si illumina', SET.errorless)}
  <p class="note">Pulsanti/sensori: tasto sinistro = freccia sinistra, 1, A o barra spaziatrice; tasto destro = freccia destra, 2, L o Invio. Vanno bene i sensori USB per la CAA che simulano questi tasti.</p>
  <div class="btns"><button id="sOk">Fatto</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('change', e => { const el = e.target; if (el.dataset.id) { const id = el.dataset.id; SET.animals = el.checked ? [...new Set([...SET.animals, id])] : SET.animals.filter(x => x !== id); } else if (el.dataset.a) SET[el.dataset.a] = el.checked; else if (el.dataset.k) SET[el.dataset.k] = (el.dataset.k === 'boxes' || el.dataset.k === 'rate' || el.dataset.k === 'pitch') ? +el.value : el.value; saveSet(); });

}

requestAnimationFrame(frame);
